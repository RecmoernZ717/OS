name: Build Alpine Sway OS ISO

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    name: Build Alpine Sway OS ISO
    runs-on: ubuntu-latest

    container:
      image: alpine:edge
      options: --privileged

    env:
      APORTS_DIR: /tmp/aports
      OS_FILES: /tmp/os-files
      ISO_OUT: /workspace/out

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install build dependencies
        shell: sh
        run: |
          set -eux

          apk update

          apk add --no-cache \
            alpine-sdk \
            alpine-conf \
            apk-tools \
            bash \
            build-base \
            busybox \
            curl \
            dbus \
            dosfstools \
            e2fsprogs \
            fakeroot \
            git \
            grub \
            grub-efi \
            mtools \
            openssh-client \
            python3 \
            py3-gobject3 \
            squashfs-tools \
            sudo \
            util-linux \
            xorriso

          python3 --version
          apk --version
          git --version
          xorriso -version


      # ==========================================================
      # APORTS
      # ==========================================================

      - name: Clone Alpine aports
        shell: sh
        run: |
          set -eux

          rm -rf "$APORTS_DIR"

          git clone \
            --depth=1 \
            https://github.com/alpinelinux/aports.git \
            "$APORTS_DIR"

          test -x "$APORTS_DIR/scripts/mkimage.sh"

          test -f "$APORTS_DIR/scripts/mkimg.base.sh"

          echo "Alpine aports ready."


      # ==========================================================
      # SIGNING KEY
      # ==========================================================

      - name: Create Alpine package signing key
        shell: sh
        run: |
          set -eux

          mkdir -p /root/.abuild
          mkdir -p /etc/apk/keys

          abuild-keygen \
            -a \
            -i \
            -n

          PRIVKEY=""

          if [ -f /root/.abuild/abuild.conf ]; then
            PRIVKEY="$(
              sed -n \
                's/^PACKAGER_PRIVKEY="\(.*\)"/\1/p' \
                /root/.abuild/abuild.conf \
                | head -n 1
            )"
          fi

          if [ -z "$PRIVKEY" ]; then
            PRIVKEY="$(
              find /root/.abuild \
                -maxdepth 1 \
                -type f \
                -name '*.rsa' \
                -print \
                | head -n 1
            )"
          fi

          test -n "$PRIVKEY"
          test -f "$PRIVKEY"
          test -f "${PRIVKEY}.pub"

          export PACKAGER_PRIVKEY="$PRIVKEY"
          export PACKAGER_PUBKEY="${PRIVKEY}.pub"

          echo "PACKAGER_PRIVKEY=$PACKAGER_PRIVKEY" >> "$GITHUB_ENV"
          echo "PACKAGER_PUBKEY=$PACKAGER_PUBKEY" >> "$GITHUB_ENV"

          cp \
            "$PACKAGER_PUBKEY" \
            /etc/apk/keys/

          echo "Private key:"
          echo "$PACKAGER_PRIVKEY"

          echo "Public key:"
          echo "$PACKAGER_PUBKEY"


      # ==========================================================
      # PATCH MKIMAGE FOR APK ROOT MODE
      # ==========================================================

      - name: Patch mkimage apk compatibility
        shell: sh
        run: |
          set -eux

          cd "$APORTS_DIR"

          sed -i \
            's/add --initdb --no-chown/add --initdb/g' \
            scripts/mkimage.sh

          if grep -q -- '--initdb --no-chown' scripts/mkimage.sh; then
            echo "mkimage.sh still contains --no-chown"
            exit 1
          fi

          chmod +x \
            scripts/mkimage.sh

          echo "mkimage.sh patched."


      # ==========================================================
      # CREATE SOURCE FILE TREE
      # ==========================================================

      - name: Create OS file tree
        shell: sh
        run: |
          set -eux

          rm -rf "$OS_FILES"

          mkdir -p \
            "$OS_FILES/configs/sway" \
            "$OS_FILES/configs/waybar" \
            "$OS_FILES/installer"


      # ==========================================================
      # SWAY
      # ==========================================================

      - name: Generate Sway configuration
        shell: sh
        run: |
          set -eux

          cat > "$OS_FILES/configs/sway/config" <<'EOF'
          set $mod Mod4
          set $term foot
          set $menu wofi --show drun

          output * bg #1e1e2e solid_color

          # Terminal
          bindsym $mod+Return exec $term

          # Launcher
          bindsym $mod+d exec $menu

          # Window controls
          bindsym $mod+Shift+q kill
          bindsym $mod+Shift+c reload
          bindsym $mod+f fullscreen
          bindsym $mod+Shift+space floating toggle

          # Focus
          bindsym $mod+Left focus left
          bindsym $mod+Down focus down
          bindsym $mod+Up focus up
          bindsym $mod+Right focus right

          # Move
          bindsym $mod+Shift+Left move left
          bindsym $mod+Shift+Down move down
          bindsym $mod+Shift+Up move up
          bindsym $mod+Shift+Right move right

          # Workspaces
          bindsym $mod+1 workspace number 1
          bindsym $mod+2 workspace number 2
          bindsym $mod+3 workspace number 3
          bindsym $mod+4 workspace number 4
          bindsym $mod+5 workspace number 5

          bindsym $mod+Shift+1 move container to workspace number 1
          bindsym $mod+Shift+2 move container to workspace number 2
          bindsym $mod+Shift+3 move container to workspace number 3
          bindsym $mod+Shift+4 move container to workspace number 4
          bindsym $mod+Shift+5 move container to workspace number 5

          # Gaps
          gaps inner 8
          gaps outer 4

          floating_modifier $mod normal

          # Border
          default_border pixel 2

          # Waybar
          exec_always waybar

          # Notifications
          exec mako

          # Network applet
          exec nm-applet
          EOF


      # ==========================================================
      # WAYBAR
      # ==========================================================

      - name: Generate Waybar configuration
        shell: sh
        run: |
          set -eux

          cat > "$OS_FILES/configs/waybar/config.jsonc" <<'EOF'
          {
              "layer": "top",
              "position": "top",
              "height": 32,

              "modules-left": [
                  "custom/launcher",
                  "sway/workspaces",
                  "sway/mode"
              ],

              "modules-center": [
                  "clock"
              ],

              "modules-right": [
                  "network",
                  "pulseaudio",
                  "battery",
                  "tray"
              ],

              "custom/launcher": {
                  "format": "  Apps  ",
                  "on-click": "wofi --show drun"
              },

              "clock": {
                  "format": "{:%Y-%m-%d %H:%M}"
              },

              "network": {
                  "format-wifi": "WiFi: {essid}",
                  "format-ethernet": "Eth: {ipaddr}",
                  "format-disconnected": "Offline"
              },

              "pulseaudio": {
                  "format": "Vol: {volume}%",
                  "format-muted": "Muted"
              },

              "battery": {
                  "format": "Bat: {capacity}%"
              },

              "tray": {
                  "spacing": 8
              }
          }
          EOF

          cat > "$OS_FILES/configs/waybar/style.css" <<'EOF'
          * {
              font-family: "JetBrains Mono", monospace;
              font-size: 13px;
              border: none;
          }

          window#waybar {
              background: #1e1e2e;
              color: #cdd6f4;
          }

          #custom-launcher {
              padding: 0 12px;
              background: #89b4fa;
              color: #1e1e2e;
              font-weight: bold;
          }

          #workspaces button {
              padding: 0 8px;
              color: #a6adc8;
          }

          #workspaces button.focused {
              background: #313244;
              color: #cdd6f4;
          }

          #clock,
          #network,
          #pulseaudio,
          #battery,
          #tray {
              padding: 0 12px;
          }
          EOF


      # ==========================================================
      # PHASE 1 INSTALLER
      # ==========================================================

      - name: Generate installer
        shell: sh
        run: |
          set -eux

          cat > "$OS_FILES/installer/phase1-installer.py" <<'PYEOF'
          #!/usr/bin/env python3

          import json
          import subprocess
          import threading
          import gi

          gi.require_version("Gtk", "4.0")

          from gi.repository import Gtk, GLib


          class InstallerWindow(Gtk.ApplicationWindow):

              def __init__(self, app):
                  super().__init__(
                      application=app,
                      title="Alpine Sway OS Installer"
                  )

                  self.set_default_size(650, 480)

                  box = Gtk.Box(
                      orientation=Gtk.Orientation.VERTICAL,
                      spacing=12
                  )

                  box.set_margin_top(24)
                  box.set_margin_bottom(24)
                  box.set_margin_start(24)
                  box.set_margin_end(24)

                  self.set_child(box)

                  title = Gtk.Label(
                      label="<span size='xx-large' weight='bold'>Alpine Sway OS</span>"
                  )

                  title.set_use_markup(True)
                  title.set_halign(Gtk.Align.START)

                  box.append(title)

                  subtitle = Gtk.Label(
                      label="Select a disk to install Alpine Sway OS."
                  )

                  subtitle.set_halign(Gtk.Align.START)

                  box.append(subtitle)

                  self.disk_combo = Gtk.ComboBoxText()

                  box.append(self.disk_combo)

                  warning = Gtk.Label(
                      label="WARNING: The selected disk will be erased."
                  )

                  warning.set_halign(Gtk.Align.START)

                  box.append(warning)

                  self.status = Gtk.Label(
                      label=""
                  )

                  self.status.set_halign(
                      Gtk.Align.START
                  )

                  box.append(self.status)

                  self.progress = Gtk.ProgressBar()

                  box.append(self.progress)

                  install = Gtk.Button(
                      label="Install"
                  )

                  install.add_css_class(
                      "suggested-action"
                  )

                  install.connect(
                      "clicked",
                      self.start_install
                  )

                  box.append(install)

                  self.install_button = install

                  self.log = Gtk.TextView()

                  self.log.set_editable(False)

                  self.log_buffer = self.log.get_buffer()

                  scroll = Gtk.ScrolledWindow()

                  scroll.set_vexpand(True)
                  scroll.set_child(self.log)

                  box.append(scroll)

                  self.populate_disks()


              def populate_disks(self):

                  try:
                      result = subprocess.check_output(
                          [
                              "lsblk",
                              "-J",
                              "-d",
                              "-o",
                              "NAME,SIZE,MODEL,TYPE"
                          ],
                          text=True
                      )

                      devices = json.loads(result)

                  except Exception as error:
                      self.status.set_text(
                          f"Disk detection failed: {error}"
                      )
                      return

                  for device in devices.get(
                      "blockdevices",
                      []
                  ):

                      name = device.get(
                          "name",
                          ""
                      )

                      if device.get("type") != "disk":
                          continue

                      if name.startswith(
                          ("loop", "ram", "sr")
                      ):
                          continue

                      path = f"/dev/{name}"

                      size = device.get(
                          "size",
                          ""
                      )

                      model = (
                          device.get(
                              "model",
                              ""
                          )
                          or ""
                      ).strip()

                      label = path

                      if size:
                          label += f" ({size})"

                      if model:
                          label += f" - {model}"

                      self.disk_combo.append(
                          path,
                          label
                      )

                  self.disk_combo.set_active(0)


              def start_install(self, _button):

                  disk = self.disk_combo.get_active_id()

                  if not disk:
                      self.status.set_text(
                          "Select a disk first."
                      )
                      return

                  self.install_button.set_sensitive(
                      False
                  )

                  self.status.set_text(
                      f"Installing to {disk}..."
                  )

                  threading.Thread(
                      target=self.install_worker,
                      args=(disk,),
                      daemon=True
                  ).start()


              def install_worker(self, disk):

                  try:

                      process = subprocess.Popen(
                          [
                              "/usr/local/bin/phase1-backend",
                              disk
                          ],
                          stdout=subprocess.PIPE,
                          stderr=subprocess.STDOUT,
                          text=True
                      )

                      for line in process.stdout:

                          GLib.idle_add(
                              self.add_log,
                              line.rstrip()
                          )

                          GLib.idle_add(
                              self.progress.pulse
                          )

                      process.wait()

                      if process.returncode == 0:

                          GLib.idle_add(
                              self.status.set_text,
                              "Installation complete."
                          )

                      else:

                          GLib.idle_add(
                              self.status.set_text,
                              f"Installation failed: {process.returncode}"
                          )

                          GLib.idle_add(
                              self.install_button.set_sensitive,
                              True
                          )

                  except Exception as error:

                      GLib.idle_add(
                          self.status.set_text,
                          f"Installation error: {error}"
                      )

                      GLib.idle_add(
                          self.install_button.set_sensitive,
                          True
                      )


              def add_log(self, line):

                  end = self.log_buffer.get_end_iter()

                  self.log_buffer.insert(
                      end,
                      line + "\n"
                  )


          class InstallerApp(Gtk.Application):

              def __init__(self):
                  super().__init__(
                      application_id="org.alpine.sway.installer"
                  )

                  self.connect(
                      "activate",
                      self.activate
                  )


              def activate(self, app):

                  window = InstallerWindow(app)

                  window.present()


          app = InstallerApp()

          app.run(None)
          PYEOF

          chmod +x \
            "$OS_FILES/installer/phase1-installer.py"


      # ==========================================================
      # OOBE
      # ==========================================================

      - name: Generate OOBE
        shell: sh
        run: |
          set -eux

          cat > "$OS_FILES/installer/phase2-oobe.py" <<'PYEOF'
          #!/usr/bin/env python3

          import subprocess
          import threading
          import gi

          gi.require_version("Gtk", "4.0")

          from gi.repository import Gtk, GLib


          class OOBEWindow(Gtk.ApplicationWindow):

              def __init__(self, app):
                  super().__init__(
                      application=app,
                      title="Welcome to Alpine Sway OS"
                  )

                  self.set_default_size(
                      600,
                      500
                  )

                  box = Gtk.Box(
                      orientation=Gtk.Orientation.VERTICAL,
                      spacing=16
                  )

                  box.set_margin_top(32)
                  box.set_margin_bottom(32)
                  box.set_margin_start(32)
                  box.set_margin_end(32)

                  self.set_child(box)

                  title = Gtk.Label(
                      label="<span size='xx-large' weight='bold'>Welcome</span>"
                  )

                  title.set_use_markup(True)

                  box.append(title)

                  user_label = Gtk.Label(
                      label="Username"
                  )

                  user_label.set_halign(
                      Gtk.Align.START
                  )

                  box.append(user_label)

                  self.user = Gtk.Entry()

                  self.user.set_placeholder_text(
                      "Username"
                  )

                  box.append(self.user)

                  pass_label = Gtk.Label(
                      label="Password"
                  )

                  pass_label.set_halign(
                      Gtk.Align.START
                  )

                  box.append(pass_label)

                  self.password = Gtk.PasswordEntry()

                  self.password.set_show_peek_icon(
                      True
                  )

                  self.password.set_placeholder_text(
                      "Password"
                  )

                  box.append(self.password)

                  host_label = Gtk.Label(
                      label="Computer name"
                  )

                  host_label.set_halign(
                      Gtk.Align.START
                  )

                  box.append(host_label)

                  self.hostname = Gtk.Entry()

                  self.hostname.set_text(
                      "alpine-sway"
                  )

                  box.append(self.hostname)

                  finish = Gtk.Button(
                      label="Finish Setup"
                  )

                  finish.add_css_class(
                      "suggested-action"
                  )

                  finish.connect(
                      "clicked",
                      self.finish
                  )

                  box.append(finish)


              def finish(self, _button):

                  username = (
                      self.user
                      .get_text()
                      .strip()
                  )

                  password = (
                      self.password
                      .get_text()
                  )

                  hostname = (
                      self.hostname
                      .get_text()
                      .strip()
                  )

                  if not username or not password:
                      return

                  if not hostname:
                      hostname = "alpine-sway"

                  threading.Thread(
                      target=self.worker,
                      args=(
                          username,
                          password,
                          hostname
                      ),
                      daemon=True
                  ).start()


              def worker(
                  self,
                  username,
                  password,
                  hostname
              ):

                  result = subprocess.run(
                      [
                          "sudo",
                          "/usr/local/bin/finalize-oobe",
                          username,
                          password,
                          hostname
                      ]
                  )

                  if result.returncode == 0:

                      GLib.idle_add(
                          self.close
                      )


          class OOBEApp(Gtk.Application):

              def __init__(self):
                  super().__init__(
                      application_id="org.alpine.sway.oobe"
                  )

                  self.connect(
                      "activate",
                      self.activate
                  )


              def activate(self, app):

                  window = OOBEWindow(app)

                  window.present()


          app = OOBEApp()

          app.run(None)
          PYEOF

          chmod +x \
            "$OS_FILES/installer/phase2-oobe.py"


      # ==========================================================
      # MKIMAGE PROFILE
      # ==========================================================

      - name: Generate Sway image profile
        shell: sh
        run: |
          set -eux

          cat > "$APORTS_DIR/scripts/mkimg.sway.sh" <<'EOF'
          profile_sway() {

              profile_base

              profile_abbrev="sway"

              title="Alpine Sway OS"

              desc="Custom Alpine Linux Sway desktop operating system."

              image_name="alpine-sway"

              output_format="iso"

              # Do not sign the kernel modloop.
              # The APK repository is still signed.
              modloop_sign=no

              # Explicitly use the ISO boot repository.
              kernel_cmdline="alpine_repo=auto"

              apkovl="genapkovl-sway.sh"

              apks="$apks

                  sway
                  swaybg
                  swayidle
                  swaylock

                  waybar
                  wofi

                  foot
                  mako

                  thunar
                  thunar-volman
                  gvfs
                  gvfs-smb

                  firefox

                  flatpak

                  xdg-desktop-portal
                  xdg-desktop-portal-wlr
                  xdg-desktop-portal-gtk

                  seatd
                  dbus
                  elogind
                  polkit-elogind

                  mesa-dri-gallium
                  xwayland

                  pipewire
                  wireplumber
                  pipewire-pulse

                  networkmanager
                  networkmanager-wifi
                  wpa_supplicant

                  python3
                  py3-gobject3
                  gtk4.0

                  font-jetbrains-mono
                  papirus-icon-theme

                  grim
                  slurp
                  wl-clipboard

                  sudo

                  util-linux
                  e2fsprogs
                  dosfstools

                  grub
                  grub-efi
                  efibootmgr
              "
          }
          EOF

          chmod +x \
            "$APORTS_DIR/scripts/mkimg.sway.sh"


      # ==========================================================
      # APOKVL
      #
      # IMPORTANT:
      # Do NOT create /etc/apk/repositories here.
      # Alpine initramfs needs to discover the ISO's local
      # .boot_repository and generate the correct repository path.
      # ==========================================================

      - name: Generate Alpine overlay
        shell: sh
        run: |
          set -eux

          cat > "$APORTS_DIR/scripts/genapkovl-sway.sh" <<'EOF'
          #!/bin/sh -e

          HOSTNAME="${1:-alpine-sway}"

          tmp="$(mktemp -d)"

          cleanup() {
              rm -rf "$tmp"
          }

          trap cleanup EXIT


          # ========================================================
          # DESKTOP CONFIG
          # ========================================================

          mkdir -p \
              "$tmp/etc/skel/.config/sway" \
              "$tmp/etc/skel/.config/waybar"


          cp \
              /tmp/os-files/configs/sway/config \
              "$tmp/etc/skel/.config/sway/config"


          cp \
              /tmp/os-files/configs/waybar/config.jsonc \
              "$tmp/etc/skel/.config/waybar/config.jsonc"


          cp \
              /tmp/os-files/configs/waybar/style.css \
              "$tmp/etc/skel/.config/waybar/style.css"


          # ========================================================
          # ROOT CONFIG
          # ========================================================

          mkdir -p \
              "$tmp/root/.config/sway" \
              "$tmp/root/.config/waybar"


          cp \
              /tmp/os-files/configs/sway/config \
              "$tmp/root/.config/sway/config"


          cp \
              /tmp/os-files/configs/waybar/config.jsonc \
              "$tmp/root/.config/waybar/config.jsonc"


          cp \
              /tmp/os-files/configs/waybar/style.css \
              "$tmp/root/.config/waybar/style.css"


          # ========================================================
          # PROFILE
          # ========================================================

          mkdir -p \
              "$tmp/etc/skel"


          cat > "$tmp/etc/skel/.profile" <<'PROFILE'
          export XDG_CURRENT_DESKTOP=sway
          export XDG_SESSION_TYPE=wayland
          export MOZ_ENABLE_WAYLAND=1
          PROFILE


          cp \
              "$tmp/etc/skel/.profile" \
              "$tmp/root/.profile"


          # ========================================================
          # HOSTNAME
          # ========================================================

          printf '%s\n' "$HOSTNAME" \
              > "$tmp/etc/hostname"


          # ========================================================
          # PHASE 1 BACKEND
          # ========================================================

          mkdir -p \
              "$tmp/usr/local/bin"


          cat > "$tmp/usr/local/bin/phase1-backend" <<'PHASE1'
          #!/bin/sh

          set -eu

          TARGET="$1"

          if [ -z "$TARGET" ]; then
              echo "No disk selected."
              exit 1
          fi

          case "$TARGET" in
              /dev/*)
                  ;;
              *)
                  echo "Invalid disk."
                  exit 1
                  ;;
          esac

          echo "Installing Alpine Sway OS to $TARGET"

          cat > /tmp/setup-answers <<ANSWERS
          KEYMAPOPTS="us us"
          HOSTNAMEOPTS="-n alpine-sway"
          INTERFACESOPTS="auto lo
          iface lo inet loopback
          "
          TIMEZONEOPTS="-z UTC"
          PROXYOPTS="none"
          APKREPOSOPTS="-1"
          USEROPTS="none"
          SSHDOPTS="openssh"
          NTPOPTS="chrony"
          DISKOPTS="-m sys $TARGET"
          ANSWERS

          setup-alpine \
              -f /tmp/setup-answers

          echo "Installation finished."

          sync

          PHASE1

          chmod +x \
              "$tmp/usr/local/bin/phase1-backend"


          # ========================================================
          # FINALIZE OOBE
          # ========================================================

          cat > "$tmp/usr/local/bin/finalize-oobe" <<'FINALIZE'
          #!/bin/sh

          set -eu

          USERNAME="$1"
          PASSWORD="$2"
          HOSTNAME="$3"


          if [ -z "$USERNAME" ]; then
              exit 1
          fi

          if [ -z "$PASSWORD" ]; then
              exit 1
          fi


          printf '%s\n' "$HOSTNAME" \
              > /etc/hostname


          if ! id "$USERNAME" >/dev/null 2>&1; then

              adduser \
                  -D \
                  -G wheel \
                  -s /bin/sh \
                  "$USERNAME"

          fi


          printf '%s:%s\n' \
              "$USERNAME" \
              "$PASSWORD" \
              | chpasswd


          for group in \
              audio \
              video \
              input \
              seat \
              netdev; do

              addgroup \
                  "$USERNAME" \
                  "$group" \
                  2>/dev/null || true

          done


          mkdir -p \
              "/home/$USERNAME/.config/sway" \
              "/home/$USERNAME/.config/waybar"


          cp \
              /etc/skel/.config/sway/config \
              "/home/$USERNAME/.config/sway/config"


          cp \
              /etc/skel/.config/waybar/config.jsonc \
              "/home/$USERNAME/.config/waybar/config.jsonc"


          cp \
              /etc/skel/.config/waybar/style.css \
              "/home/$USERNAME/.config/waybar/style.css"


          cp \
              /etc/skel/.profile \
              "/home/$USERNAME/.profile"


          chown -R \
              "$USERNAME:$USERNAME" \
              "/home/$USERNAME"


          sync

          reboot
          FINALIZE

          chmod +x \
              "$tmp/usr/local/bin/finalize-oobe"


          # ========================================================
          # OOBE PYTHON
          # ========================================================

          cp \
              /tmp/os-files/installer/phase2-oobe.py \
              "$tmp/usr/local/bin/phase2-oobe.py"


          chmod +x \
              "$tmp/usr/local/bin/phase2-oobe.py"


          # ========================================================
          # LIVE ISO INIT
          # ========================================================

          mkdir -p \
              "$tmp/etc"


          cat > "$tmp/etc/inittab" <<'INITTAB'
          ::sysinit:/sbin/openrc sysinit
          ::sysinit:/sbin/openrc boot
          ::wait:/sbin/openrc default

          tty1::respawn:/bin/login -f root
          tty2::respawn:/sbin/getty 38400 tty2

          ::ctrlaltdel:/sbin/reboot
          ::shutdown:/sbin/openrc shutdown
          INITTAB


          # ========================================================
          # SERVICES
          # ========================================================

          mkdir -p \
              "$tmp/etc/runlevels/default" \
              "$tmp/etc/runlevels/boot" \
              "$tmp/etc/runlevels/sysinit"


          for service in \
              dbus \
              seatd \
              NetworkManager; do

              if [ -e "/etc/init.d/$service" ]; then
                  ln -sf \
                      "/etc/init.d/$service" \
                      "$tmp/etc/runlevels/default/$service"
              fi

          done


          # ========================================================
          # DO NOT CREATE /etc/apk/repositories
          #
          # This is intentional.
          #
          # Alpine's initramfs discovers:
          #
          #   /apks/.boot_repository
          #
          # and generates the correct repository path itself.
          # ========================================================


          # ========================================================
          # PACKAGE WORLD
          # ========================================================

          mkdir -p \
              "$tmp/etc/apk"


          cat > "$tmp/etc/apk/world" <<'WORLD'
          alpine-base
          sway
          swaybg
          swayidle
          swaylock
          waybar
          wofi
          foot
          mako
          thunar
          firefox
          flatpak
          seatd
          dbus
          elogind
          networkmanager
          python3
          py3-gobject3
          gtk4.0
          util-linux
          e2fsprogs
          dosfstools
          WORLD


          # ========================================================
          # CREATE OVERLAY
          # ========================================================

          tar \
              -C "$tmp" \
              -czf \
              "$HOSTNAME.apkovl.tar.gz" \
              etc \
              root \
              usr

          EOF

          chmod +x \
            "$APORTS_DIR/scripts/genapkovl-sway.sh"


      # ==========================================================
      # VALIDATE SCRIPTS
      # ==========================================================

      - name: Validate generated files
        shell: sh
        run: |
          set -eux

          test -x \
            "$APORTS_DIR/scripts/mkimage.sh"

          test -x \
            "$APORTS_DIR/scripts/mkimg.sway.sh"

          test -x \
            "$APORTS_DIR/scripts/genapkovl-sway.sh"

          python3 -m py_compile \
            "$OS_FILES/installer/phase1-installer.py"

          python3 -m py_compile \
            "$OS_FILES/installer/phase2-oobe.py"

          sh -n \
            "$APORTS_DIR/scripts/mkimage.sh"

          sh -n \
            "$APORTS_DIR/scripts/mkimg.sway.sh"

          sh -n \
            "$APORTS_DIR/scripts/genapkovl-sway.sh"

          echo "Validation passed."


      # ==========================================================
      # CHECK SIGNING ENVIRONMENT
      # ==========================================================

      - name: Validate signing configuration
        shell: sh
        run: |
          set -eux

          test -n "$PACKAGER_PRIVKEY"
          test -n "$PACKAGER_PUBKEY"

          test -f "$PACKAGER_PRIVKEY"
          test -f "$PACKAGER_PUBKEY"

          test -f \
            "/etc/apk/keys/$(basename "$PACKAGER_PUBKEY")"

          echo "Signing configuration is valid."


      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build Alpine Sway OS ISO
        shell: sh
        run: |
          set -eux

          rm -rf "$ISO_OUT"

          mkdir -p \
            "$ISO_OUT"

          cd "$APORTS_DIR"

          ./scripts/mkimage.sh \
            --tag edge \
            --outdir "$ISO_OUT" \
            --arch x86_64 \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/main \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/community \
            --profile sway


      # ==========================================================
      # FIND ISO
      # ==========================================================

      - name: Inspect ISO output
        shell: sh
        run: |
          set -eux

          find "$ISO_OUT" \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n'

          ISO_FILE="$(
            find "$ISO_OUT" \
              -maxdepth 1 \
              -type f \
              -name '*.iso' \
              -print \
              | head -n 1
          )"

          test -n "$ISO_FILE"
          test -f "$ISO_FILE"

          echo "ISO_FILE=$ISO_FILE" >> "$GITHUB_ENV"

          ls -lh "$ISO_FILE"


      # ==========================================================
      # VERIFY THE ISO BOOT REPOSITORY
      #
      # This catches the exact problem shown in the VirtualBox
      # screenshot before the ISO is uploaded.
      # ==========================================================

      - name: Verify ISO boot repository
        shell: sh
        run: |
          set -eux

          ISO_FILE="$ISO_FILE"

          MOUNT_DIR="/tmp/iso-check"

          rm -rf "$MOUNT_DIR"

          mkdir -p \
            "$MOUNT_DIR"

          mount \
            -o loop,ro \
            "$ISO_FILE" \
            "$MOUNT_DIR"

          trap 'umount "$MOUNT_DIR" 2>/dev/null || true' EXIT

          echo "ISO contents:"

          ls -lah \
            "$MOUNT_DIR"

          echo "Checking /apks..."

          test -d \
            "$MOUNT_DIR/apks"

          echo "Checking .boot_repository..."

          test -f \
            "$MOUNT_DIR/apks/.boot_repository"

          echo "Checking x86_64 APK repository..."

          test -d \
            "$MOUNT_DIR/apks/x86_64"

          test -f \
            "$MOUNT_DIR/apks/x86_64/APKINDEX.tar.gz"

          echo "Checking boot files..."

          test -d \
            "$MOUNT_DIR/apks/boot"

          find \
            "$MOUNT_DIR/apks/boot" \
            -maxdepth 3 \
            -type f \
            -print

          echo "Checking APK signing files..."

          find \
            "$MOUNT_DIR/apks/x86_64" \
            -maxdepth 1 \
            -type f \
            -name '*.SIGN.RSA.*' \
            -print

          echo "BOOT REPOSITORY VALID."


      # ==========================================================
      # SHA256
      # ==========================================================

      - name: Generate SHA256 checksum
        shell: sh
        run: |
          set -eux

          cd "$ISO_OUT"

          sha256sum \
            "$(basename "$ISO_FILE")" \
            > sha256sums.txt

          cat sha256sums.txt


      # ==========================================================
      # ARTIFACT
      # ==========================================================

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-sway-os-iso
          path: |
            /workspace/out/*.iso
            /workspace/out/sha256sums.txt
          retention-days: 14


      # ==========================================================
      # RELEASE
      # ==========================================================

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /workspace/out/*.iso
            /workspace/out/sha256sums.txt
          generate_release_notes: true
