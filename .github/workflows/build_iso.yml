name: Build Alpine Sway OS ISO

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    name: Build Alpine Sway OS ISO
    runs-on: ubuntu-latest

    container:
      image: alpine:edge
      options: --privileged

    env:
      APORTS_DIR: /tmp/aports
      OS_FILES: /tmp/os-files
      ISO_OUT: /workspace/out

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # BUILD DEPENDENCIES
      # ============================================================

      - name: Install Alpine ISO build dependencies
        shell: sh
        run: |
          set -eux

          apk update

          apk add --no-cache \
            alpine-sdk \
            alpine-conf \
            apk-tools \
            bash \
            build-base \
            busybox \
            ca-certificates \
            curl \
            dbus \
            dosfstools \
            e2fsprogs \
            fakeroot \
            git \
            grub \
            grub-efi \
            mtools \
            openssh-client \
            python3 \
            py3-gobject3 \
            squashfs-tools \
            sudo \
            util-linux \
            xorriso


      # ============================================================
      # ALPINE APORTS
      # ============================================================

      - name: Clone Alpine aports
        shell: sh
        run: |
          set -eux

          rm -rf "$APORTS_DIR"

          git clone \
            --depth=1 \
            https://github.com/alpinelinux/aports.git \
            "$APORTS_DIR"

          test -f "$APORTS_DIR/scripts/mkimage.sh"


      # ============================================================
      # PATCH MKIMAGE FOR CURRENT EDGE
      # ============================================================

      - name: Patch mkimage.sh for Alpine edge
        shell: sh
        run: |
          set -eux

          MKIMAGE="$APORTS_DIR/scripts/mkimage.sh"

          test -f "$MKIMAGE"

          sed -i \
            's/ add --initdb --no-chown/ add --initdb/g' \
            "$MKIMAGE"

          grep -n "initdb" "$MKIMAGE" || true


      # ============================================================
      # ABUILD SIGNING KEY
      # ============================================================

      - name: Configure abuild signing key
        shell: sh
        run: |
          set -eux

          export HOME="${HOME:-/github/home}"

          mkdir -p "$HOME/.config/abuild"
          mkdir -p /etc/apk/keys

          abuild-keygen -a -i -n

          PRIVKEY="$(
            find "$HOME/.config/abuild" \
              -maxdepth 1 \
              -type f \
              -name '*.rsa' \
              -print \
              | head -n 1
          )"

          test -n "$PRIVKEY"
          test -f "$PRIVKEY"

          PUBKEY="${PRIVKEY}.pub"

          test -f "$PUBKEY"

          cp "$PUBKEY" /etc/apk/keys/

          echo "PACKAGER_PRIVKEY=$PRIVKEY" >> "$GITHUB_ENV"
          echo "PACKAGER_PUBKEY=$PUBKEY" >> "$GITHUB_ENV"

          echo "Signing key:"
          echo "$PRIVKEY"


      # ============================================================
      # DIRECTORY STRUCTURE
      # ============================================================

      - name: Generate Sway OS files
        shell: sh
        run: |
          set -eux

          rm -rf "$OS_FILES"

          mkdir -p \
            "$OS_FILES/configs/sway" \
            "$OS_FILES/configs/waybar" \
            "$OS_FILES/configs/nwg-dock" \
            "$OS_FILES/installer"


      # ============================================================
      # SWAY CONFIG
      # ============================================================

      - name: Generate Sway configuration
        shell: sh
        run: |
          set -eux

          cat > "$OS_FILES/configs/sway/config" <<'EOF'
          set $mod Mod4
          set $term foot
          set $menu wofi --show drun

          output * bg #1e1e2e solid_color

          bindsym $mod+Return exec $term
          bindsym $mod+d exec $menu

          bindsym $mod+Shift+q kill
          bindsym $mod+Shift+c reload
          bindsym $mod+Shift+e exit

          bindsym $mod+Left focus left
          bindsym $mod+Down focus down
          bindsym $mod+Up focus up
          bindsym $mod+Right focus right

          bindsym $mod+Shift+Left move left
          bindsym $mod+Shift+Down move down
          bindsym $mod+Shift+Up move up
          bindsym $mod+Shift+Right move right

          bindsym $mod+1 workspace number 1
          bindsym $mod+2 workspace number 2
          bindsym $mod+3 workspace number 3
          bindsym $mod+4 workspace number 4
          bindsym $mod+5 workspace number 5

          bindsym $mod+Shift+1 move container to workspace number 1
          bindsym $mod+Shift+2 move container to workspace number 2
          bindsym $mod+Shift+3 move container to workspace number 3
          bindsym $mod+Shift+4 move container to workspace number 4
          bindsym $mod+Shift+5 move container to workspace number 5

          bindsym $mod+f fullscreen
          bindsym $mod+Shift+space floating toggle

          floating_modifier $mod normal

          gaps inner 8
          gaps outer 4

          default_border pixel 2

          client.focused #89b4fa #1e1e2e #cdd6f4 #89b4fa #89b4fa

          bar {
              swaybar_command waybar
          }

          exec mako
          EOF


      # ============================================================
      # WAYBAR
      # ============================================================

      - name: Generate Waybar configuration
        shell: sh
        run: |
          set -eux

          cat > "$OS_FILES/configs/waybar/config.jsonc" <<'EOF'
          {
              "layer": "top",
              "position": "top",
              "height": 30,

              "modules-left": [
                  "custom/launcher",
                  "sway/workspaces",
                  "sway/mode"
              ],

              "modules-center": [
                  "clock"
              ],

              "modules-right": [
                  "network",
                  "pulseaudio",
                  "battery"
              ],

              "custom/launcher": {
                  "format": "Apps",
                  "on-click": "wofi --show drun"
              },

              "clock": {
                  "format": "{:%Y-%m-%d %H:%M:%S}"
              },

              "network": {
                  "format-wifi": "WiFi: {essid}",
                  "format-ethernet": "Eth: {ipaddr}",
                  "format-disconnected": "Offline"
              },

              "pulseaudio": {
                  "format": "Vol: {volume}%",
                  "format-muted": "Muted"
              },

              "battery": {
                  "format": "Bat: {capacity}%"
              }
          }
          EOF


          cat > "$OS_FILES/configs/waybar/style.css" <<'EOF'
          * {
              font-family: monospace;
              font-size: 13px;
              border: none;
              border-radius: 0;
          }

          window#waybar {
              background-color: #1e1e2e;
              color: #cdd6f4;
          }

          #custom-launcher {
              padding: 0 12px;
              background-color: #89b4fa;
              color: #1e1e2e;
              font-weight: bold;
          }

          #workspaces button {
              padding: 0 8px;
              color: #a6adc8;
          }

          #workspaces button.focused {
              background-color: #313244;
              color: #cdd6f4;
          }

          #clock,
          #network,
          #pulseaudio,
          #battery {
              padding: 0 12px;
          }
          EOF


      # ============================================================
      # DOCK CONFIG
      # ============================================================

      - name: Generate dock configuration
        shell: sh
        run: |
          set -eux

          cat > "$OS_FILES/configs/nwg-dock/pinned" <<'EOF'
          foot
          firefox
          thunar
          EOF


      # ============================================================
      # PHASE 1 INSTALLER
      # ============================================================

      - name: Generate Phase 1 installer
        shell: sh
        run: |
          set -eux

          cat > "$OS_FILES/installer/phase1-installer.py" <<'EOF'
          #!/usr/bin/env python3

          import json
          import subprocess
          import threading

          import gi

          gi.require_version("Gtk", "4.0")

          from gi.repository import Gtk, GLib


          class Phase1Window(Gtk.ApplicationWindow):

              def __init__(self, app):
                  super().__init__(
                      application=app,
                      title="Install Alpine Sway OS"
                  )

                  self.set_default_size(560, 420)
                  self.set_resizable(False)

                  box = Gtk.Box(
                      orientation=Gtk.Orientation.VERTICAL,
                      spacing=14
                  )

                  box.set_margin_top(24)
                  box.set_margin_bottom(24)
                  box.set_margin_start(24)
                  box.set_margin_end(24)

                  self.set_child(box)


                  title = Gtk.Label(
                      label="<span size='x-large' weight='bold'>Install Alpine Sway OS</span>"
                  )

                  title.set_use_markup(True)
                  title.set_halign(Gtk.Align.START)

                  box.append(title)


                  self.stack = Gtk.Stack()
                  self.stack.set_vexpand(True)

                  box.append(self.stack)


                  page = Gtk.Box(
                      orientation=Gtk.Orientation.VERTICAL,
                      spacing=12
                  )


                  label = Gtk.Label(
                      label="Select the target drive:"
                  )

                  label.set_halign(Gtk.Align.START)

                  page.append(label)


                  self.disk_combo = Gtk.ComboBoxText()

                  self.populate_disks()

                  page.append(self.disk_combo)


                  warning = Gtk.Label(
                      label="WARNING: Installing will erase the selected drive."
                  )

                  warning.set_halign(Gtk.Align.START)

                  page.append(warning)


                  install_button = Gtk.Button(
                      label="Install OS to Disk"
                  )

                  install_button.add_css_class(
                      "suggested-action"
                  )

                  install_button.connect(
                      "clicked",
                      self.start_install
                  )

                  page.append(install_button)


                  self.stack.add_named(
                      page,
                      "select"
                  )


                  progress_page = Gtk.Box(
                      orientation=Gtk.Orientation.VERTICAL,
                      spacing=12
                  )


                  self.status = Gtk.Label(
                      label="Installing..."
                  )

                  self.status.set_halign(
                      Gtk.Align.START
                  )

                  progress_page.append(
                      self.status
                  )


                  self.progress = Gtk.ProgressBar()

                  progress_page.append(
                      self.progress
                  )


                  self.log_view = Gtk.TextView()

                  self.log_view.set_editable(False)


                  scroll = Gtk.ScrolledWindow()

                  scroll.set_vexpand(True)

                  scroll.set_child(
                      self.log_view
                  )

                  progress_page.append(
                      scroll
                  )


                  self.reboot_button = Gtk.Button(
                      label="Reboot"
                  )

                  self.reboot_button.set_sensitive(
                      False
                  )

                  self.reboot_button.connect(
                      "clicked",
                      self.reboot
                  )

                  progress_page.append(
                      self.reboot_button
                  )


                  self.stack.add_named(
                      progress_page,
                      "progress"
                  )


              def populate_disks(self):

                  try:

                      result = subprocess.check_output(
                          [
                              "lsblk",
                              "-J",
                              "-d",
                              "-o",
                              "NAME,SIZE,MODEL"
                          ],
                          text=True
                      )

                      devices = json.loads(
                          result
                      ).get(
                          "blockdevices",
                          []
                      )


                      for device in devices:

                          name = device.get(
                              "name",
                              ""
                          )

                          if name.startswith(
                              (
                                  "loop",
                                  "sr",
                                  "ram"
                              )
                          ):
                              continue


                          path = "/dev/" + name

                          size = device.get(
                              "size",
                              ""
                          )

                          model = device.get(
                              "model",
                              ""
                          )

                          display = (
                              f"{path} "
                              f"({size} "
                              f"{model.strip()})"
                          )


                          self.disk_combo.append(
                              path,
                              display
                          )


                      self.disk_combo.set_active(0)


                  except Exception as error:

                      self.status_error = str(
                          error
                      )


              def start_install(self, _button):

                  disk = self.disk_combo.get_active_id()

                  if not disk:
                      return


                  self.stack.set_visible_child_name(
                      "progress"
                  )


                  threading.Thread(
                      target=self.run_install,
                      args=(disk,),
                      daemon=True
                  ).start()


              def append_log(self, text):

                  buffer = self.log_view.get_buffer()

                  end = buffer.get_end_iter()

                  buffer.insert(
                      end,
                      text
                  )


              def run_install(self, disk):

                  try:

                      process = subprocess.Popen(
                          [
                              "/usr/local/bin/phase1-backend",
                              disk
                          ],
                          stdout=subprocess.PIPE,
                          stderr=subprocess.STDOUT,
                          text=True
                      )


                      for line in process.stdout:

                          GLib.idle_add(
                              self.append_log,
                              line
                          )

                          GLib.idle_add(
                              self.progress.pulse
                          )


                      process.wait()


                      if process.returncode == 0:

                          GLib.idle_add(
                              self.status.set_text,
                              "Installation complete."
                          )

                          GLib.idle_add(
                              self.progress.set_fraction,
                              1.0
                          )

                          GLib.idle_add(
                              self.reboot_button.set_sensitive,
                              True
                          )

                      else:

                          GLib.idle_add(
                              self.status.set_text,
                              "Installation failed."
                          )


                  except Exception as error:

                      GLib.idle_add(
                          self.status.set_text,
                          f"Error: {error}"
                      )


              def reboot(self, _button):

                  subprocess.run(
                      ["reboot"]
                  )


          class App(Gtk.Application):

              def __init__(self):

                  super().__init__(
                      application_id="org.alpine.sway.installer"
                  )


              def do_activate(self):

                  window = Phase1Window(
                      self
                  )

                  window.present()


          App().run()
          EOF

          chmod +x \
            "$OS_FILES/installer/phase1-installer.py"


      # ============================================================
      # PHASE 2 OOBE
      # ============================================================

      - name: Generate Phase 2 OOBE
        shell: sh
        run: |
          set -eux

          cat > "$OS_FILES/installer/phase2-oobe.py" <<'EOF'
          #!/usr/bin/env python3

          import subprocess
          import threading

          import gi

          gi.require_version("Gtk", "4.0")

          from gi.repository import Gtk, GLib


          class OOBEWindow(Gtk.ApplicationWindow):

              def __init__(self, app):

                  super().__init__(
                      application=app,
                      title="Welcome to Alpine Sway OS"
                  )

                  self.set_default_size(
                      600,
                      450
                  )


                  outer = Gtk.Box(
                      orientation=Gtk.Orientation.VERTICAL,
                      spacing=20
                  )

                  outer.set_margin_top(40)
                  outer.set_margin_bottom(40)
                  outer.set_margin_start(40)
                  outer.set_margin_end(40)

                  self.set_child(
                      outer
                  )


                  self.stack = Gtk.Stack()

                  self.stack.set_vexpand(True)

                  outer.append(
                      self.stack
                  )


                  # ------------------------------------------------
                  # WIFI
                  # ------------------------------------------------

                  wifi = Gtk.Box(
                      orientation=Gtk.Orientation.VERTICAL,
                      spacing=12
                  )


                  wifi.append(
                      Gtk.Label(
                          label="Connect to Wi-Fi"
                      )
                  )


                  self.wifi_combo = Gtk.ComboBoxText()

                  wifi.append(
                      self.wifi_combo
                  )


                  self.wifi_password = Gtk.Entry()

                  self.wifi_password.set_placeholder_text(
                      "Wi-Fi Password"
                  )

                  self.wifi_password.set_visibility(
                      False
                  )

                  wifi.append(
                      self.wifi_password
                  )


                  self.wifi_status = Gtk.Label(
                      label=""
                  )

                  wifi.append(
                      self.wifi_status
                  )


                  buttons = Gtk.Box(
                      orientation=Gtk.Orientation.HORIZONTAL,
                      spacing=8
                  )


                  refresh = Gtk.Button(
                      label="Refresh"
                  )

                  refresh.connect(
                      "clicked",
                      lambda _: self.scan_wifi()
                  )

                  buttons.append(
                      refresh
                  )


                  skip = Gtk.Button(
                      label="Skip"
                  )

                  skip.connect(
                      "clicked",
                      lambda _: self.stack.set_visible_child_name(
                          "user"
                      )
                  )

                  buttons.append(
                      skip
                  )


                  connect = Gtk.Button(
                      label="Connect & Next"
                  )

                  connect.add_css_class(
                      "suggested-action"
                  )

                  connect.connect(
                      "clicked",
                      self.connect_wifi
                  )

                  buttons.append(
                      connect
                  )


                  wifi.append(
                      buttons
                  )


                  self.stack.add_named(
                      wifi,
                      "wifi"
                  )


                  # ------------------------------------------------
                  # USER
                  # ------------------------------------------------

                  account = Gtk.Box(
                      orientation=Gtk.Orientation.VERTICAL,
                      spacing=12
                  )


                  account.append(
                      Gtk.Label(
                          label="Create Your Account"
                      )
                  )


                  self.host_entry = Gtk.Entry(
                      text="alpine-sway"
                  )

                  self.host_entry.set_placeholder_text(
                      "Computer Name"
                  )

                  account.append(
                      self.host_entry
                  )


                  self.user_entry = Gtk.Entry()

                  self.user_entry.set_placeholder_text(
                      "Username"
                  )

                  account.append(
                      self.user_entry
                  )


                  self.password_entry = Gtk.Entry()

                  self.password_entry.set_placeholder_text(
                      "Password"
                  )

                  self.password_entry.set_visibility(
                      False
                  )

                  account.append(
                      self.password_entry
                  )


                  finish = Gtk.Button(
                      label="Finish & Launch Desktop"
                  )

                  finish.add_css_class(
                      "suggested-action"
                  )

                  finish.connect(
                      "clicked",
                      self.finish
                  )

                  account.append(
                      finish
                  )


                  self.stack.add_named(
                      account,
                      "user"
                  )


                  self.stack.set_visible_child_name(
                      "wifi"
                  )


                  self.scan_wifi()


              def scan_wifi(self):

                  self.wifi_combo.remove_all()


                  try:

                      subprocess.run(
                          [
                              "nmcli",
                              "dev",
                              "wifi",
                              "rescan"
                          ],
                          stderr=subprocess.DEVNULL
                      )


                      output = subprocess.check_output(
                          [
                              "nmcli",
                              "-t",
                              "-f",
                              "SSID",
                              "dev",
                              "wifi",
                              "list"
                          ],
                          text=True
                      )


                      seen = set()


                      for line in output.splitlines():

                          ssid = line.strip()

                          if (
                              ssid
                              and ssid not in seen
                          ):

                              seen.add(
                                  ssid
                              )

                              self.wifi_combo.append_text(
                                  ssid
                              )


                      if seen:

                          self.wifi_combo.set_active(
                              0
                          )


                  except Exception:

                      pass


              def connect_wifi(self, _button):

                  ssid = self.wifi_combo.get_active_text()

                  password = self.wifi_password.get_text()


                  if not ssid:
                      return


                  self.wifi_status.set_text(
                      "Connecting..."
                  )


                  def worker():

                      result = subprocess.run(
                          [
                              "sudo",
                              "nmcli",
                              "dev",
                              "wifi",
                              "connect",
                              ssid,
                              "password",
                              password
                          ]
                      )


                      if result.returncode == 0:

                          GLib.idle_add(
                              self.stack.set_visible_child_name,
                              "user"
                          )

                      else:

                          GLib.idle_add(
                              self.wifi_status.set_text,
                              "Connection failed."
                          )


                  threading.Thread(
                      target=worker,
                      daemon=True
                  ).start()


              def finish(self, _button):

                  user = (
                      self.user_entry
                      .get_text()
                      .strip()
                      .lower()
                  )

                  password = (
                      self.password_entry
                      .get_text()
                  )

                  hostname = (
                      self.host_entry
                      .get_text()
                      .strip()
                      or "alpine-sway"
                  )


                  if not user or not password:
                      return


                  subprocess.run(
                      [
                          "sudo",
                          "/usr/local/bin/finalize-oobe",
                          user,
                          password,
                          hostname
                      ]
                  )


          class App(Gtk.Application):

              def __init__(self):

                  super().__init__(
                      application_id="org.alpine.sway.oobe"
                  )


              def do_activate(self):

                  window = OOBEWindow(
                      self
                  )

                  window.present()


          App().run()
          EOF

          chmod +x \
            "$OS_FILES/installer/phase2-oobe.py"


      # ============================================================
      # MKIMAGE PROFILE
      # ============================================================

      - name: Generate Alpine Sway image profile
        shell: sh
        run: |
          set -eux

          cat > "$APORTS_DIR/scripts/mkimg.sway.sh" <<'EOF'
          profile_sway() {

              profile_base

              profile_abbrev="sway"

              title="Alpine Sway OS"

              desc="Custom Alpine Linux Sway desktop operating system."

              image_name="alpine-sway"

              image_ext="iso"

              output_format="iso"

              arch="x86_64"

              modloop_sign=no

              apkovl="genapkovl-sway.sh"


              # Remove Alpine's network-extras meta-package.
              # It can conflict with vlan/ifupdown-ng combinations.

              apks="$(echo "$apks" | sed 's/network-extras//g')"


              apks="$apks

                  sway
                  swaybg
                  swayidle
                  swaylock

                  waybar
                  wofi
                  foot
                  mako

                  thunar
                  gvfs
                  gvfs-smb

                  firefox

                  flatpak

                  xdg-desktop-portal
                  xdg-desktop-portal-wlr
                  xdg-desktop-portal-gtk

                  seatd
                  dbus

                  elogind
                  polkit-elogind

                  mesa-dri-gallium
                  xwayland

                  pipewire
                  wireplumber
                  pipewire-pulse

                  networkmanager
                  networkmanager-wifi
                  wpa_supplicant

                  python3
                  py3-gobject3
                  gtk4.0

                  grim
                  slurp
                  wl-clipboard

                  sudo

                  util-linux
                  e2fsprogs
                  dosfstools

                  grub
                  grub-efi
                  efibootmgr

              "
          }
          EOF

          chmod +x \
            "$APORTS_DIR/scripts/mkimg.sway.sh"


      # ============================================================
      # ALPINE OVERLAY
      # ============================================================

      - name: Generate Alpine overlay
        shell: sh
        run: |
          set -eux

          cat > "$APORTS_DIR/scripts/genapkovl-sway.sh" <<'EOF'
          #!/bin/sh -e

          HOSTNAME="$1"

          [ -n "$HOSTNAME" ]


          tmp="$(mktemp -d)"

          trap 'rm -rf "$tmp"' EXIT


          # --------------------------------------------------------
          # FILE HELPER
          # --------------------------------------------------------

          makefile() {

              OWNER="$1"
              PERMS="$2"
              FILENAME="$3"

              mkdir -p "$(dirname "$FILENAME")"

              cat > "$FILENAME"

              chown "$OWNER" "$FILENAME"

              chmod "$PERMS" "$FILENAME"
          }


          # --------------------------------------------------------
          # OPENRC RUNLEVEL HELPER
          # --------------------------------------------------------

          rc_add() {

              SERVICE="$1"
              RUNLEVEL="$2"

              mkdir -p \
                  "$tmp/etc/runlevels/$RUNLEVEL"

              ln -sf \
                  "/etc/init.d/$SERVICE" \
                  "$tmp/etc/runlevels/$RUNLEVEL/$SERVICE"
          }


          # --------------------------------------------------------
          # CONFIG FILES
          # --------------------------------------------------------

          mkdir -p \
              "$tmp/etc/skel/.config" \
              "$tmp/root/.config"


          cp -r \
              /tmp/os-files/configs/* \
              "$tmp/etc/skel/.config/"


          cp -r \
              /tmp/os-files/configs/* \
              "$tmp/root/.config/"


          # --------------------------------------------------------
          # ROOT PROFILE
          # --------------------------------------------------------

          makefile \
              root:root \
              0644 \
              "$tmp/root/.profile" <<'PROFILE'

          export XDG_CURRENT_DESKTOP=sway
          export MOZ_ENABLE_WAYLAND=1

          if [ -z "$DISPLAY" ] &&
             [ -z "$WAYLAND_DISPLAY" ] &&
             [ "$(tty)" = "/dev/tty1" ]; then

              exec dbus-run-session sway

          fi

          PROFILE


          # --------------------------------------------------------
          # USER PROFILE
          # --------------------------------------------------------

          makefile \
              root:root \
              0644 \
              "$tmp/etc/skel/.profile" <<'PROFILE'

          export XDG_CURRENT_DESKTOP=sway
          export MOZ_ENABLE_WAYLAND=1

          if [ -z "$DISPLAY" ] &&
             [ -z "$WAYLAND_DISPLAY" ] &&
             [ "$(tty)" = "/dev/tty1" ]; then

              exec dbus-run-session sway

          fi

          PROFILE


          # --------------------------------------------------------
          # HOSTNAME
          # --------------------------------------------------------

          makefile \
              root:root \
              0644 \
              "$tmp/etc/hostname" <<'HOSTNAME'

          alpine-sway

          HOSTNAME


          # --------------------------------------------------------
          # IMPORTANT:
          #
          # DO NOT REPLACE /etc/inittab.
          #
          # Alpine's normal init/getty handling is intentionally
          # preserved. This prevents the custom live environment
          # from breaking normal console shutdown/exit behavior.
          # --------------------------------------------------------


          # --------------------------------------------------------
          # INSTALLER PROGRAMS
          # --------------------------------------------------------

          mkdir -p \
              "$tmp/usr/local/bin"


          cp \
              /tmp/os-files/installer/phase1-installer.py \
              "$tmp/usr/local/bin/phase1-installer.py"


          cp \
              /tmp/os-files/installer/phase2-oobe.py \
              "$tmp/usr/local/bin/phase2-oobe.py"


          chmod +x \
              "$tmp/usr/local/bin/phase1-installer.py" \
              "$tmp/usr/local/bin/phase2-oobe.py"


          # --------------------------------------------------------
          # PHASE 1 BACKEND
          # --------------------------------------------------------

          makefile \
              root:root \
              0755 \
              "$tmp/usr/local/bin/phase1-backend" <<'PHASE1'

          #!/bin/sh

          set -e


          TARGET_DISK="$1"


          if [ -z "$TARGET_DISK" ]; then

              echo "No target disk specified."

              exit 1

          fi


          # --------------------------------------------------------
          # PARTITION NAMING
          # --------------------------------------------------------

          case "$TARGET_DISK" in

              /dev/nvme*n*)
                  ROOT_PART="${TARGET_DISK}p2"
                  ;;

              /dev/mmcblk*)
                  ROOT_PART="${TARGET_DISK}p2"
                  ;;

              *)
                  ROOT_PART="${TARGET_DISK}2"
                  ;;

          esac


          echo "Target disk: $TARGET_DISK"

          echo "Expected root partition: $ROOT_PART"


          # --------------------------------------------------------
          # ALPINE SETUP ANSWERS
          # --------------------------------------------------------

          cat > /tmp/setup-answers <<ANS

          KEYMAPOPTS="us us"

          HOSTNAMEOPTS="-n alpine-sway"

          INTERFACESOPTS="auto lo
          iface lo inet loopback
          "

          TIMEZONEOPTS="-z UTC"

          PROXYOPTS="none"

          APKREPOSOPTS="-1"

          USEROPTS="none"

          SSHDOPTS="-c openssh"

          NTPOPTS="-c openntpd"

          DISKOPTS="-m sys $TARGET_DISK"

          ANS


          # --------------------------------------------------------
          # RUN ALPINE INSTALLER
          # --------------------------------------------------------

          setup-alpine \
              -f /tmp/setup-answers


          # --------------------------------------------------------
          # MOUNT INSTALLED SYSTEM
          # --------------------------------------------------------

          if ! mount "$ROOT_PART" /mnt; then

              echo "Could not mount $ROOT_PART."

              exit 1

          fi


          # --------------------------------------------------------
          # COPY DESKTOP CONFIGURATION
          # --------------------------------------------------------

          mkdir -p \
              /mnt/etc/skel/.config


          cp -r \
              /etc/skel/.config/* \
              /mnt/etc/skel/.config/ \
              || true


          # --------------------------------------------------------
          # COPY OOBE
          # --------------------------------------------------------

          mkdir -p \
              /mnt/usr/local/bin


          cp \
              /usr/local/bin/phase2-oobe.py \
              /mnt/usr/local/bin/phase2-oobe.py


          chmod +x \
              /mnt/usr/local/bin/phase2-oobe.py


          # --------------------------------------------------------
          # TEMPORARY OEM USER
          # --------------------------------------------------------

          chroot /mnt \
              adduser \
              -D \
              -G wheel \
              -s /bin/sh \
              oem \
              || true


          for group in \
              audio \
              video \
              netdev \
              seat \
              input
          do

              chroot /mnt \
                  addgroup \
                  oem \
                  "$group" \
                  2>/dev/null \
                  || true

          done


          # --------------------------------------------------------
          # SUDO
          # --------------------------------------------------------

          mkdir -p \
              /mnt/etc/sudoers.d


          echo \
              "oem ALL=(ALL) NOPASSWD: ALL" \
              > /mnt/etc/sudoers.d/oem


          # --------------------------------------------------------
          # OEM SWAY CONFIG
          # --------------------------------------------------------

          mkdir -p \
              /mnt/home/oem/.config/sway


          cat > /mnt/home/oem/.config/sway/config <<'SWAY'

          output * bg #1e1e2e solid_color

          exec python3 /usr/local/bin/phase2-oobe.py

          SWAY


          # --------------------------------------------------------
          # PROFILE
          # --------------------------------------------------------

          cp \
              /etc/skel/.profile \
              /mnt/home/oem/.profile \
              || true


          chroot /mnt \
              chown \
              -R \
              oem:oem \
              /home/oem


          sync


          umount /mnt


          echo

          echo "Phase 1 installation completed."

          PHASE1


          # --------------------------------------------------------
          # FINALIZE OOBE
          # --------------------------------------------------------

          makefile \
              root:root \
              0755 \
              "$tmp/usr/local/bin/finalize-oobe" <<'PHASE2'

          #!/bin/sh

          set -e


          NEW_USER="$1"
          NEW_PASS="$2"
          NEW_HOST="$3"


          if [ -z "$NEW_USER" ] ||
             [ -z "$NEW_PASS" ]; then

              echo "Username and password are required."

              exit 1

          fi


          NEW_HOST="${NEW_HOST:-alpine-sway}"


          # --------------------------------------------------------
          # HOSTNAME
          # --------------------------------------------------------

          echo "$NEW_HOST" \
              > /etc/hostname


          hostname \
              "$NEW_HOST"


          # --------------------------------------------------------
          # USER
          # --------------------------------------------------------

          adduser \
              -D \
              -G wheel \
              -s /bin/sh \
              "$NEW_USER"


          for group in \
              audio \
              video \
              netdev \
              seat \
              input
          do

              addgroup \
                  "$NEW_USER" \
                  "$group" \
                  2>/dev/null \
                  || true

          done


          # --------------------------------------------------------
          # PASSWORD
          # --------------------------------------------------------

          echo \
              "$NEW_USER:$NEW_PASS" \
              | chpasswd


          # --------------------------------------------------------
          # USER CONFIG
          # --------------------------------------------------------

          mkdir -p \
              "/home/$NEW_USER/.config"


          cp -r \
              /etc/skel/.config/* \
              "/home/$NEW_USER/.config/" \
              || true


          cp \
              /etc/skel/.profile \
              "/home/$NEW_USER/.profile"


          chown \
              -R \
              "$NEW_USER:$NEW_USER" \
              "/home/$NEW_USER"


          # --------------------------------------------------------
          # FLATHUB
          # --------------------------------------------------------

          if command -v flatpak >/dev/null 2>&1; then

              flatpak remote-add \
                  --if-not-exists \
                  flathub \
                  https://flathub.org/repo/flathub.flatpakrepo \
                  || true

          fi


          # --------------------------------------------------------
          # REMOVE OEM
          # --------------------------------------------------------

          rm -f \
              /etc/sudoers.d/oem


          deluser \
              --remove-home \
              oem \
              2>/dev/null \
              || true


          # --------------------------------------------------------
          # REBOOT
          # --------------------------------------------------------

          echo

          echo "Setup complete."

          echo

          echo "Rebooting..."

          sleep 2

          reboot

          PHASE2


          # ========================================================
          # OPENRC SERVICES
          # ========================================================

          rc_add devfs sysinit
          rc_add dmesg sysinit
          rc_add mdev sysinit
          rc_add hwdrivers sysinit

          rc_add hwclock boot
          rc_add modules boot
          rc_add sysctl boot
          rc_add hostname boot
          rc_add bootmisc boot
          rc_add syslog boot

          rc_add dbus default
          rc_add seatd default
          rc_add networkmanager default


          # ========================================================
          # BUILD APK OVERLAY
          # ========================================================

          tar \
              -c \
              -C "$tmp" \
              etc \
              root \
              usr \
              | gzip -9n \
              > "$HOSTNAME.apkovl.tar.gz"

          EOF


          chmod +x \
              "$APORTS_DIR/scripts/genapkovl-sway.sh"


      # ============================================================
      # VALIDATE GENERATED FILES
      # ============================================================

      - name: Validate generated files
        shell: sh
        run: |
          set -eux

          test -f \
            "$APORTS_DIR/scripts/mkimg.sway.sh"

          test -f \
            "$APORTS_DIR/scripts/genapkovl-sway.sh"

          test -f \
            "$OS_FILES/installer/phase1-installer.py"

          test -f \
            "$OS_FILES/installer/phase2-oobe.py"


          sh -n \
            "$APORTS_DIR/scripts/mkimg.sway.sh"


          sh -n \
            "$APORTS_DIR/scripts/genapkovl-sway.sh"


          python3 -m py_compile \
            "$OS_FILES/installer/phase1-installer.py"


          python3 -m py_compile \
            "$OS_FILES/installer/phase2-oobe.py"


          echo

          echo "Generated files validated."


      # ============================================================
      # VERIFY SIGNING
      # ============================================================

      - name: Verify signing configuration
        shell: sh
        run: |
          set -eux

          test -n "$PACKAGER_PRIVKEY"
          test -f "$PACKAGER_PRIVKEY"

          test -n "$PACKAGER_PUBKEY"
          test -f "$PACKAGER_PUBKEY"


          echo "Private key:"
          ls -l "$PACKAGER_PRIVKEY"


          echo "Public key:"
          ls -l "$PACKAGER_PUBKEY"


      # ============================================================
      # BUILD ISO
      # ============================================================

      - name: Build Alpine Sway OS ISO
        shell: sh
        run: |
          set -eux

          mkdir -p \
            "$ISO_OUT"


          cd \
            "$APORTS_DIR"


          ./scripts/mkimage.sh \
            --tag edge \
            --outdir "$ISO_OUT" \
            --arch x86_64 \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/main \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/community \
            --profile sway


      # ============================================================
      # INSPECT ISO
      # ============================================================

      - name: Inspect ISO output
        shell: sh
        run: |
          set -eux

          echo "ISO output directory:"

          ls -lah \
            "$ISO_OUT"


          ISO_FILE="$(
            find "$ISO_OUT" \
              -maxdepth 1 \
              -type f \
              -name '*.iso' \
              -print \
              | head -n 1
          )"


          test -n "$ISO_FILE"
          test -f "$ISO_FILE"


          echo

          echo "ISO:"
          echo "$ISO_FILE"


          echo

          echo "ISO size:"

          du -h \
            "$ISO_FILE"


          echo

          echo "ISO file type:"

          file \
            "$ISO_FILE" \
            || true


          echo \
            "ISO_FILE=$ISO_FILE" \
            >> "$GITHUB_ENV"


      # ============================================================
      # VERIFY ISO
      #
      # IMPORTANT:
      # Alpine's boot files are under:
      #
      #   /boot
      #
      # NOT:
      #
      #   /apks/boot
      #
      # Also, the APK signature is NOT treated as a required
      # ISO-structure check.
      # ============================================================

      - name: Verify ISO boot structure
        shell: sh
        run: |
          set -eux

          test -f "$ISO_FILE"


          MOUNT_DIR="/tmp/iso-check"


          rm -rf \
            "$MOUNT_DIR"


          mkdir -p \
            "$MOUNT_DIR"


          mount \
            -o loop,ro \
            "$ISO_FILE" \
            "$MOUNT_DIR"


          cleanup() {

              umount \
                "$MOUNT_DIR" \
                2>/dev/null \
                || true

          }


          trap cleanup EXIT


          echo
          echo "========================================"
          echo "ISO ROOT"
          echo "========================================"


          ls -lah \
            "$MOUNT_DIR"


          # --------------------------------------------------------
          # BASIC ISO DIRECTORIES
          # --------------------------------------------------------

          test -d \
            "$MOUNT_DIR/apks"


          test -d \
            "$MOUNT_DIR/boot"


          test -d \
            "$MOUNT_DIR/efi"


          # --------------------------------------------------------
          # APK REPOSITORY
          # --------------------------------------------------------

          test -f \
            "$MOUNT_DIR/apks/.boot_repository"


          test -d \
            "$MOUNT_DIR/apks/x86_64"


          test -f \
            "$MOUNT_DIR/apks/x86_64/APKINDEX.tar.gz"


          echo

          echo "Boot repository marker:"

          cat \
            "$MOUNT_DIR/apks/.boot_repository"


          echo

          echo "APK repository:"

          ls -lah \
            "$MOUNT_DIR/apks/x86_64"


          # --------------------------------------------------------
          # BOOT FILES
          # --------------------------------------------------------

          echo

          echo "Boot files:"


          find \
            "$MOUNT_DIR/boot" \
            -maxdepth 3 \
            -type f \
            -print


          test -f \
            "$MOUNT_DIR/boot/vmlinuz-lts"


          test -f \
            "$MOUNT_DIR/boot/initramfs-lts"


          test -f \
            "$MOUNT_DIR/boot/modloop-lts"


          # --------------------------------------------------------
          # SYSLINUX
          # --------------------------------------------------------

          test -f \
            "$MOUNT_DIR/boot/syslinux/isolinux.bin"


          test -f \
            "$MOUNT_DIR/boot/syslinux/syslinux.cfg"


          # --------------------------------------------------------
          # EFI
          # --------------------------------------------------------

          echo

          echo "EFI files:"


          find \
            "$MOUNT_DIR/efi" \
            -maxdepth 4 \
            -type f \
            -print


          test -f \
            "$MOUNT_DIR/efi/boot/bootx64.efi"


          # --------------------------------------------------------
          # OPTIONAL SIGNATURE INFORMATION
          #
          # This is informational only.
          # It must NOT make the build fail.
          # --------------------------------------------------------

          echo

          echo "Repository signatures, if present:"


          find \
            "$MOUNT_DIR/apks/x86_64" \
            -maxdepth 1 \
            -type f \
            -name '*.SIGN.RSA.*' \
            -print \
            || true


          # --------------------------------------------------------
          # FINAL ISO VALIDATION
          # --------------------------------------------------------

          echo

          echo "========================================"
          echo "ISO STRUCTURE VALID"
          echo "========================================"


          echo

          echo "Kernel:"

          ls -lh \
            "$MOUNT_DIR/boot/vmlinuz-lts"


          echo

          echo "Initramfs:"

          ls -lh \
            "$MOUNT_DIR/boot/initramfs-lts"


          echo

          echo "Modloop:"

          ls -lh \
            "$MOUNT_DIR/boot/modloop-lts"


          echo

          echo "APK index:"

          ls -lh \
            "$MOUNT_DIR/apks/x86_64/APKINDEX.tar.gz"


          echo

          echo "UEFI:"

          ls -lh \
            "$MOUNT_DIR/efi/boot/bootx64.efi"


          echo

          echo "ISO VERIFICATION PASSED"


      # ============================================================
      # SHA256
      # ============================================================

      - name: Generate SHA256 checksum
        shell: sh
        run: |
          set -eux

          cd \
            "$ISO_OUT"


          sha256sum \
            *.iso \
            > sha256sums.txt


          cat \
            sha256sums.txt


      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-sway-os-iso
          path: |
            /workspace/out/*.iso
            /workspace/out/sha256sums.txt
          retention-days: 14


      # ============================================================
      # RELEASE
      # ============================================================

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /workspace/out/*.iso
            /workspace/out/sha256sums.txt
          generate_release_notes: true
