name: Build Alpine Sway ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: alpine:edge

    env:
      OUTDIR: out

    steps:
      - name: Install build dependencies
        shell: sh
        run: |
          set -eux
          apk update
          # nodejs is required so JS actions (checkout, upload-artifact,
          # action-gh-release) can run inside the Alpine container.
          apk add --no-cache \
            abuild \
            alpine-conf \
            apk-tools \
            bash \
            ca-certificates \
            curl \
            dosfstools \
            e2fsprogs \
            fakeroot \
            git \
            grub \
            grub-bios \
            grub-efi \
            mkinitfs \
            mtools \
            nodejs \
            openssl \
            squashfs-tools \
            sudo \
            syslinux \
            tar \
            util-linux \
            xorriso

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Alpine aports
        shell: sh
        run: |
          set -eux
          rm -rf /tmp/aports
          git clone --depth 1 https://github.com/alpinelinux/aports.git /tmp/aports

      - name: Create APK signing key
        shell: sh
        run: |
          set -eux
          mkdir -p /root/.abuild

          export PACKAGER_PRIVKEY=/root/.abuild/alpineos.rsa
          abuild-keygen -a -i -n -q

          ls -l /root/.abuild/ /etc/apk/keys/

          echo "PACKAGER_PRIVKEY=/root/.abuild/alpineos.rsa" >> "$GITHUB_ENV"
          echo "PACKAGER_PUBKEY=/root/.abuild/alpineos.rsa.pub" >> "$GITHUB_ENV"

      - name: Write package list
        shell: sh
        run: |
          set -eux

          # Single source of truth: used for the ISO profile AND the live world file.
          cat > /tmp/sway-packages.txt <<'EOF'
          alpine-base
          alpine-conf
          busybox
          openrc
          linux-lts
          wireless-regdb
          wpa_supplicant
          rfkill

          linux-firmware-intel
          linux-firmware-rtlwifi
          linux-firmware-rtl_bt
          linux-firmware-rtw88
          linux-firmware-rtw89
          linux-firmware-ath10k
          linux-firmware-ath11k
          linux-firmware-brcm
          linux-firmware-mediatek
          linux-firmware-qca

          eudev
          udev-init-scripts
          udev-init-scripts-openrc

          sway
          swaybg
          swayidle
          swaylock
          waybar
          foot
          xkeyboard-config
          font-dejavu

          mesa-dri-gallium
          mesa-egl
          mesa-gbm
          mesa-gles

          dbus
          dbus-openrc
          seatd
          seatd-openrc
          elogind
          elogind-openrc

          networkmanager
          networkmanager-cli
          networkmanager-openrc
          networkmanager-wifi
          networkmanager-tui
          network-manager-applet

          bluez
          bluez-openrc
          blueman

          pipewire
          pipewire-pulse
          wireplumber
          pulseaudio-utils

          python3
          py3-gobject3
          gtk4.0

          util-linux
          e2fsprogs
          dosfstools
          parted

          sfdisk
          syslinux
          grub
          grub-bios
          grub-efi
          efibootmgr
          mkinitfs
          doas
          bash
          curl
          wget
          git
          nano
          vim
          pciutils
          usbutils
          EOF

          # Drop blank lines
          sed -i '/^[[:space:]]*$/d' /tmp/sway-packages.txt
          sed -i 's/^[[:space:]]*//' /tmp/sway-packages.txt

      - name: Create mkimage profile
        shell: sh
        run: |
          set -eux

          # mkimage.sh only loads profiles from scripts/mkimg.<name>.sh
          PROFILE=/tmp/aports/scripts/mkimg.sway.sh

          {
            cat <<'EOF'
          profile_sway() {
              profile_standard

              title="Alpine Sway OS"
              desc="Custom Alpine Linux Sway desktop ISO"
              profile_abbrev="sway"
              kernel_flavors="lts"
              hostname="alpine-sway"
              apkovl="genapkovl-sway.sh"
              apks="$apks
          EOF
            cat /tmp/sway-packages.txt
            cat <<'EOF'
              "
          }
          EOF
          } > "$PROFILE"

          cat "$PROFILE"

      - name: Create Sway configuration overlay
        shell: sh
        run: |
          set -eux

          TMP=/tmp/sway-overlay
          rm -rf "$TMP"

          mkdir -p \
            "$TMP/etc/apk" \
            "$TMP/etc/profile.d" \
            "$TMP/etc/skel" \
            "$TMP/etc/sway" \
            "$TMP/etc/xdg/waybar" \
            "$TMP/etc/NetworkManager" \
            "$TMP/root" \
            "$TMP/usr/local/bin" \
            "$TMP/usr/local/sbin"

          # ---------------- environment ----------------
          cat > "$TMP/etc/profile.d/sway.sh" <<'EOF'
          export XDG_CURRENT_DESKTOP=sway
          export XDG_SESSION_TYPE=wayland
          export MOZ_ENABLE_WAYLAND=1
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/tmp/runtime-$(id -u)}"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          EOF
          chmod 644 "$TMP/etc/profile.d/sway.sh"

          # ---------------- sway ----------------
          cat > "$TMP/etc/sway/config" <<'EOF'
          set $mod Mod4

          font pango:DejaVu Sans 10

          output * bg #202020 solid_color

          default_border pixel 2
          default_floating_border pixel 2

          input type:keyboard {
              xkb_layout us
          }

          input type:pointer {
              accel_profile flat
          }

          exec dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway

          exec_always --no-startup-id waybar

          # Tray applets for Wi-Fi and Bluetooth
          exec nm-applet --indicator
          exec blueman-applet

          # Launch the installer automatically on start
          exec python3 /usr/local/bin/phase1-installer.py
          for_window [app_id="org.alpineos.installer"] floating enable, resize set 700 500, move position center

          bindsym $mod+Return exec foot
          bindsym $mod+d exec foot
          bindsym $mod+Shift+q kill
          bindsym $mod+Shift+c reload
          bindsym $mod+Shift+e exec swaynag -t warning -m 'Exit Sway?' -B 'Exit' 'swaymsg exit'

          bindsym $mod+1 workspace number 1
          bindsym $mod+2 workspace number 2
          bindsym $mod+3 workspace number 3
          bindsym $mod+4 workspace number 4
          bindsym $mod+5 workspace number 5

          bindsym $mod+Shift+1 move container to workspace number 1
          bindsym $mod+Shift+2 move container to workspace number 2
          bindsym $mod+Shift+3 move container to workspace number 3
          bindsym $mod+Shift+4 move container to workspace number 4
          bindsym $mod+Shift+5 move container to workspace number 5

          bindsym $mod+f fullscreen toggle
          bindsym $mod+space floating toggle
          bindsym $mod+Shift+space focus mode_toggle

          bindsym $mod+Left focus left
          bindsym $mod+Right focus right
          bindsym $mod+Up focus up
          bindsym $mod+Down focus down

          bindsym $mod+Shift+Left move left
          bindsym $mod+Shift+Right move right
          bindsym $mod+Shift+Up move up
          bindsym $mod+Shift+Down move down

          bindsym XF86AudioRaiseVolume exec pactl set-sink-volume @DEFAULT_SINK@ +5%
          bindsym XF86AudioLowerVolume exec pactl set-sink-volume @DEFAULT_SINK@ -5%
          bindsym XF86AudioMute exec pactl set-sink-mute @DEFAULT_SINK@ toggle
          EOF

          # ---------------- waybar (system path is /etc/xdg/waybar) ----------------
          cat > "$TMP/etc/xdg/waybar/config" <<'EOF'
          {
              "layer": "top",
              "position": "top",
              "height": 30,
              "modules-left": ["sway/workspaces"],
              "modules-center": ["clock"],
              "modules-right": ["tray", "bluetooth", "network", "cpu", "memory"],
              "tray": { "spacing": 8 },
              "bluetooth": {
                  "format": "BT {status}",
                  "format-connected": "BT {device_alias}",
                  "format-disabled": "BT off",
                  "on-click": "blueman-manager"
              },
              "clock": { "format": "{:%Y-%m-%d %H:%M:%S}" },
              "cpu": { "format": "CPU {usage}%" },
              "memory": { "format": "RAM {}%" },
              "network": {
                  "format-wifi": "WiFi {essid}",
                  "format-ethernet": "Ethernet",
                  "format-disconnected": "Offline",
                  "on-click": "foot nmtui"
              }
          }
          EOF

          cat > "$TMP/etc/xdg/waybar/style.css" <<'EOF'
          * {
              font-family: sans-serif;
              font-size: 13px;
          }

          window#waybar {
              background: rgba(20, 20, 20, 0.95);
              color: white;
          }

          #workspaces button {
              padding: 0 8px;
              color: white;
          }

          #clock, #cpu, #memory, #network {
              padding: 0 10px;
          }
          EOF

          # ---------------- NetworkManager (correct path/case) ----------------
          cat > "$TMP/etc/NetworkManager/NetworkManager.conf" <<'EOF'
          [main]
          plugins=keyfile
          EOF

          # ---------------- installer ----------------
          cat > "$TMP/usr/local/sbin/phase1-backend" <<'EOF'
          #!/bin/sh
          # Alpine Sway OS install backend.
          # Environment: DISK (e.g. /dev/sda), INSTALL_USER, INSTALL_PASS
          set -eu

          : "${DISK:?DISK not set}"
          : "${INSTALL_USER:?INSTALL_USER not set}"
          : "${INSTALL_PASS:?INSTALL_PASS not set}"

          [ -b "$DISK" ] || { echo "ERROR: $DISK is not a block device"; exit 1; }

          T=/mnt/target

          cleanup() {
              for m in dev proc sys; do umount -l "$T/$m" 2>/dev/null || true; done
              umount "$T/boot/efi" 2>/dev/null || true
              umount "$T/boot" 2>/dev/null || true
              umount "$T" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "==> [1/5] Partitioning $DISK and installing base system"
          export ERASE_DISKS="$DISK"
          setup-disk -m sys -s 0 "$DISK"

          echo "==> [2/5] Mounting installed system"
          ROOT_PART="$(lsblk -brnpo NAME,FSTYPE,SIZE "$DISK" \
              | awk '$2=="ext4" {print $3, $1}' | sort -n | tail -n1 | cut -d' ' -f2)"
          [ -n "$ROOT_PART" ] || { echo "ERROR: could not find root partition"; exit 1; }
          echo "Root partition: $ROOT_PART"

          mkdir -p "$T"
          mount "$ROOT_PART" "$T"
          mount --bind /dev "$T/dev"
          mount -t proc proc "$T/proc"
          mount -t sysfs sys "$T/sys"

          echo "==> [3/5] Installing desktop packages"
          sed 's/#.*//' /etc/apk/world | grep -v '^[[:space:]]*$' > /tmp/install-world
          # shellcheck disable=SC2046
          apk --root "$T" --repositories-file /etc/apk/repositories add \
              $(tr '\n' ' ' < /tmp/install-world)

          echo "==> [4/5] Applying configuration"
          mkdir -p "$T/etc/sway" "$T/etc/xdg/waybar" "$T/etc/NetworkManager" "$T/etc/profile.d"

          # The installed system must not relaunch the installer
          grep -v -e 'phase1-installer' -e 'org.alpineos.installer' /etc/sway/config > "$T/etc/sway/config"
          cp /etc/xdg/waybar/config "$T/etc/xdg/waybar/config"
          cp /etc/xdg/waybar/style.css "$T/etc/xdg/waybar/style.css"
          cp /etc/NetworkManager/NetworkManager.conf "$T/etc/NetworkManager/NetworkManager.conf"
          cp /etc/profile.d/sway.sh "$T/etc/profile.d/sway.sh"

          cat > "$T/etc/apk/repositories" <<REPOS
          https://dl-cdn.alpinelinux.org/alpine/edge/main
          https://dl-cdn.alpinelinux.org/alpine/edge/community
          REPOS

          echo "alpine-sway" > "$T/etc/hostname"

          add_svc() {
              chroot "$T" rc-update add "$1" "$2" >/dev/null 2>&1 || true
          }
          for s in devfs dmesg udev udev-trigger; do add_svc "$s" sysinit; done
          for s in modules sysctl hostname bootmisc syslog; do add_svc "$s" boot; done
          for s in dbus bluetooth seatd elogind networkmanager; do add_svc "$s" default; done
          for s in mount-ro killprocs savecache; do add_svc "$s" shutdown; done

          echo "==> [5/5] Creating user $INSTALL_USER"
          chroot "$T" adduser -D -s /bin/bash "$INSTALL_USER"
          printf '%s:%s\n' "$INSTALL_USER" "$INSTALL_PASS" | chroot "$T" chpasswd -c sha512
          for g in wheel video input audio seat netdev plugdev; do
              chroot "$T" addgroup "$INSTALL_USER" "$g" >/dev/null 2>&1 || true
          done

          mkdir -p "$T/etc/doas.d"
          echo "permit persist :wheel" > "$T/etc/doas.d/wheel.conf"

          # Start Sway automatically when the user logs in on tty1
          cat > "$T/home/$INSTALL_USER/.profile" <<'PROFILE'
          if [ -z "${WAYLAND_DISPLAY:-}" ] && [ "$(tty)" = "/dev/tty1" ]; then
              export LIBSEAT_BACKEND=seatd
              exec dbus-run-session sway
          fi
          PROFILE
          chroot "$T" chown "$INSTALL_USER:$INSTALL_USER" "/home/$INSTALL_USER/.profile"

          sync
          echo "==> Installation complete"
          EOF
          chmod +x "$TMP/usr/local/sbin/phase1-backend"

          cat > "$TMP/usr/local/bin/phase1-installer.py" <<'EOF'
          #!/usr/bin/env python3
          import os
          import re
          import subprocess
          import sys
          import threading

          import gi

          gi.require_version("Gtk", "4.0")
          from gi.repository import GLib, Gtk  # noqa: E402

          BACKEND = "/usr/local/sbin/phase1-backend"


          def list_disks():
              """Return [(device, description)] for installable disks, excluding the live medium."""
              live = set()
              try:
                  src = subprocess.run(
                      ["findmnt", "-no", "SOURCE", "/media/cdrom"],
                      capture_output=True, text=True, check=False,
                  ).stdout.strip()
                  if src:
                      parent = subprocess.run(
                          ["lsblk", "-no", "PKNAME", src],
                          capture_output=True, text=True, check=False,
                      ).stdout.strip()
                      live.add(parent or os.path.basename(src))
              except Exception:
                  pass

              out = subprocess.run(
                  ["lsblk", "-dn", "-o", "NAME,SIZE,TYPE,MODEL"],
                  capture_output=True, text=True, check=False,
              ).stdout
              disks = []
              for line in out.splitlines():
                  parts = line.split(None, 3)
                  if len(parts) < 3 or parts[2] != "disk":
                      continue
                  name, size = parts[0], parts[1]
                  if name in live or name.startswith(("loop", "ram", "zram")):
                      continue
                  model = parts[3].strip() if len(parts) > 3 else ""
                  disks.append((f"/dev/{name}", f"/dev/{name} - {size} {model}".strip()))
              return disks


          class Installer(Gtk.Application):
              def __init__(self):
                  super().__init__(application_id="org.alpineos.installer")
                  self.window = None
                  self.disks = []
                  self.installing = False
                  self.pulse_id = None

              def do_activate(self):
                  if self.window is not None:
                      self.window.present()
                      return

                  self.window = Gtk.ApplicationWindow(application=self)
                  self.window.set_title("Alpine Sway OS Installer")
                  self.window.set_default_size(700, 560)

                  box = Gtk.Box(orientation=Gtk.Orientation.VERTICAL, spacing=10)
                  for side in ("top", "bottom", "start", "end"):
                      getattr(box, f"set_margin_{side}")(20)

                  title = Gtk.Label()
                  title.set_markup("<span size='xx-large'><b>Alpine Sway OS</b></span>")
                  box.append(title)

                  self.disks = list_disks()
                  labels = [d[1] for d in self.disks] or ["No installable disks found"]
                  box.append(Gtk.Label(label="Target disk (will be erased):", xalign=0))
                  self.disk_dd = Gtk.DropDown.new_from_strings(labels)
                  box.append(self.disk_dd)

                  box.append(Gtk.Label(label="Username:", xalign=0))
                  self.user_entry = Gtk.Entry()
                  self.user_entry.set_text("user")
                  box.append(self.user_entry)

                  box.append(Gtk.Label(label="Password:", xalign=0))
                  self.pass_entry = Gtk.PasswordEntry()
                  self.pass_entry.set_show_peek_icon(True)
                  box.append(self.pass_entry)

                  box.append(Gtk.Label(label="Confirm password:", xalign=0))
                  self.pass2_entry = Gtk.PasswordEntry()
                  self.pass2_entry.set_show_peek_icon(True)
                  box.append(self.pass2_entry)

                  self.install_btn = Gtk.Button(label="Install")
                  self.install_btn.add_css_class("suggested-action")
                  self.install_btn.connect("clicked", self.on_install_clicked)
                  self.install_btn.set_sensitive(bool(self.disks))
                  box.append(self.install_btn)

                  self.progress = Gtk.ProgressBar()
                  box.append(self.progress)

                  self.status = Gtk.Label(label="Ready.", xalign=0)
                  self.status.set_wrap(True)
                  box.append(self.status)

                  self.log = Gtk.TextView()
                  self.log.set_editable(False)
                  self.log.set_monospace(True)
                  self.log.set_cursor_visible(False)
                  scroll = Gtk.ScrolledWindow()
                  scroll.set_vexpand(True)
                  scroll.set_child(self.log)
                  box.append(scroll)

                  self.reboot_btn = Gtk.Button(label="Reboot")
                  self.reboot_btn.set_visible(False)
                  self.reboot_btn.connect("clicked", lambda _b: subprocess.Popen(["reboot"]))
                  box.append(self.reboot_btn)

                  self.window.set_child(box)
                  self.window.present()

              # ---- helpers ----
              def set_status(self, text):
                  self.status.set_text(text)

              def append_log(self, text):
                  buf = self.log.get_buffer()
                  buf.insert(buf.get_end_iter(), text)
                  mark = buf.create_mark(None, buf.get_end_iter(), False)
                  self.log.scroll_to_mark(mark, 0.0, False, 0.0, 0.0)
                  return False

              def set_busy(self, busy):
                  self.installing = busy
                  for w in (self.install_btn, self.disk_dd, self.user_entry,
                            self.pass_entry, self.pass2_entry):
                      w.set_sensitive(not busy)
                  if busy:
                      self.pulse_id = GLib.timeout_add(150, self.pulse)
                  elif self.pulse_id:
                      GLib.source_remove(self.pulse_id)
                      self.pulse_id = None

              def pulse(self):
                  self.progress.pulse()
                  return True

              # ---- install flow ----
              def on_install_clicked(self, _button):
                  user = self.user_entry.get_text().strip()
                  pw = self.pass_entry.get_text()
                  pw2 = self.pass2_entry.get_text()

                  if not re.fullmatch(r"[a-z_][a-z0-9_-]{0,31}", user):
                      self.set_status("Invalid username (lowercase letters, digits, - and _ only).")
                      return
                  if not pw:
                      self.set_status("Password cannot be empty.")
                      return
                  if pw != pw2:
                      self.set_status("Passwords do not match.")
                      return
                  if not self.disks:
                      self.set_status("No installable disk available.")
                      return

                  disk = self.disks[self.disk_dd.get_selected()][0]

                  dialog = Gtk.AlertDialog()
                  dialog.set_message(f"Erase {disk} and install Alpine Sway OS?")
                  dialog.set_detail("ALL DATA ON THIS DISK WILL BE LOST.")
                  dialog.set_buttons(["Cancel", "Erase and install"])
                  dialog.set_cancel_button(0)
                  dialog.set_default_button(0)
                  dialog.choose(
                      self.window, None,
                      lambda d, r: self.on_confirm(d, r, disk, user, pw),
                  )

              def on_confirm(self, dialog, result, disk, user, pw):
                  try:
                      choice = dialog.choose_finish(result)
                  except Exception:
                      return
                  if choice != 1:
                      return

                  self.set_busy(True)
                  self.reboot_btn.set_visible(False)
                  self.set_status(f"Installing to {disk}... this can take several minutes.")
                  env = dict(os.environ, DISK=disk, INSTALL_USER=user, INSTALL_PASS=pw)
                  threading.Thread(target=self.run_backend, args=(env,), daemon=True).start()

              def run_backend(self, env):
                  code = 1
                  try:
                      proc = subprocess.Popen(
                          [BACKEND], env=env,
                          stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
                      )
                      for line in proc.stdout:
                          GLib.idle_add(self.append_log, line)
                          if line.startswith("==>"):
                              GLib.idle_add(self.set_status, line.strip("=> \n"))
                      code = proc.wait()
                  except Exception as exc:
                      GLib.idle_add(self.append_log, f"Installer error: {exc}\n")
                  GLib.idle_add(self.finish, code)

              def finish(self, code):
                  self.set_busy(False)
                  if code == 0:
                      self.progress.set_fraction(1.0)
                      self.set_status("Installation complete. Remove the ISO and reboot.")
                      self.install_btn.set_sensitive(False)
                      self.reboot_btn.set_visible(True)
                  else:
                      self.progress.set_fraction(0.0)
                      self.set_status(f"Installation failed (exit code {code}). See log below.")
                  return False


          sys.exit(Installer().run(sys.argv))
          EOF
          chmod +x "$TMP/usr/local/bin/phase1-installer.py"

          # ---------------- motd ----------------
          cat > "$TMP/etc/motd" <<'EOF'
          Alpine Sway OS - live environment

          tty1 logs in as root and starts Sway and the graphical installer automatically.
          Other TTYs: log in as root (no password). To start manually:
              dbus-run-session sway
              python3 /usr/local/bin/phase1-installer.py
          EOF

          # ---------------- world file ----------------
          cp /tmp/sway-packages.txt "$TMP/etc/apk/world"

          cp "$TMP/etc/profile.d/sway.sh" "$TMP/etc/skel/.profile"

          # ---------------- autologin + autostart ----------------
          cat > "$TMP/usr/local/sbin/autologin-root" <<'EOF'
          #!/bin/sh
          exec /bin/login -f root
          EOF
          chmod +x "$TMP/usr/local/sbin/autologin-root"

          # Replace the default inittab so tty1 logs in root automatically
          cat > "$TMP/etc/inittab" <<'EOF'
          ::sysinit:/sbin/openrc sysinit
          ::sysinit:/sbin/openrc boot
          ::wait:/sbin/openrc default

          tty1::respawn:/sbin/getty -n -l /usr/local/sbin/autologin-root 38400 tty1
          tty2::respawn:/sbin/getty 38400 tty2
          tty3::respawn:/sbin/getty 38400 tty3

          ::ctrlaltdel:/sbin/reboot
          ::shutdown:/sbin/openrc shutdown
          EOF

          # Root's profile: start Sway on tty1, which launches the installer
          cp "$TMP/etc/profile.d/sway.sh" "$TMP/root/.profile"
          cat >> "$TMP/root/.profile" <<'EOF'

          if [ -z "${WAYLAND_DISPLAY:-}" ] && [ "$(tty)" = "/dev/tty1" ]; then
              export LIBSEAT_BACKEND=seatd
              exec dbus-run-session sway
          fi
          EOF

          find "$TMP" -mindepth 1 | sort

      - name: Install apkovl generator
        shell: sh
        run: |
          set -eux

          # mkimage.sh calls: ./genapkovl-sway.sh <hostname>
          # and expects <hostname>.apkovl.tar.gz in the current directory.
          cat > /tmp/aports/scripts/genapkovl-sway.sh <<'EOF'
          #!/bin/sh -e

          HOSTNAME="$1"
          if [ -z "$HOSTNAME" ]; then
              echo "usage: $0 hostname" >&2
              exit 1
          fi

          SRC="${SWAY_OVERLAY:-/tmp/sway-overlay}"
          [ -d "$SRC" ] || { echo "overlay $SRC missing" >&2; exit 1; }

          cleanup() { rm -rf "$tmp"; }
          tmp="$(mktemp -d)"
          trap cleanup EXIT

          cp -a "$SRC"/. "$tmp"/

          mkdir -p "$tmp/etc"
          echo "$HOSTNAME" > "$tmp/etc/hostname"

          mkdir -p "$tmp/etc/network"
          cat > "$tmp/etc/network/interfaces" <<IFACES
          auto lo
          iface lo inet loopback
          IFACES

          rc_add() {
              mkdir -p "$tmp/etc/runlevels/$2"
              ln -sf "/etc/init.d/$1" "$tmp/etc/runlevels/$2/$1"
          }

          # sysinit
          rc_add devfs sysinit
          rc_add dmesg sysinit
          rc_add udev sysinit
          rc_add udev-trigger sysinit

          # boot
          rc_add modules boot
          rc_add sysctl boot
          rc_add hostname boot
          rc_add bootmisc boot
          rc_add syslog boot

          # default
          rc_add dbus default
          rc_add bluetooth default
          rc_add seatd default
          rc_add elogind default
          rc_add networkmanager default

          # shutdown
          rc_add mount-ro shutdown
          rc_add killprocs shutdown
          rc_add savecache shutdown

          tar -c -C "$tmp" etc root usr | gzip -9n > "$HOSTNAME.apkovl.tar.gz"
          EOF

          chmod +x /tmp/aports/scripts/genapkovl-sway.sh

      - name: Dry-run package resolution
        shell: sh
        run: |
          set -eux
          apk update
          # Simulate only: confirms every package name exists without installing the desktop.
          apk add --simulate $(tr '\n' ' ' < /tmp/sway-packages.txt) > /dev/null

      - name: Build Alpine ISO
        shell: sh
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/$OUTDIR"
          cd /tmp/aports

          sh scripts/mkimage.sh \
            --tag edge \
            --outdir "$GITHUB_WORKSPACE/$OUTDIR" \
            --arch x86_64 \
            --hostkeys \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/main \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/community \
            --profile sway

      - name: Verify generated ISO
        shell: sh
        run: |
          set -eux

          find "$GITHUB_WORKSPACE/$OUTDIR" -maxdepth 2 -type f -ls

          ISO="$(find "$GITHUB_WORKSPACE/$OUTDIR" -type f -name '*.iso' | head -n 1)"
          [ -n "$ISO" ] || { echo "ERROR: No ISO was generated."; exit 1; }

          du -h "$ISO"
          xorriso -indev "$ISO" -find / -maxdepth 2 -print

      - name: Calculate SHA256
        shell: sh
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/$OUTDIR"
          sha256sum *.iso > SHA256SUMS
          cat SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-sway-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpine-sway-${{ github.run_number }}
          name: Alpine Sway OS ${{ github.run_number }}
          files: |
            out/*.iso
            out/SHA256SUMS
          generate_release_notes: true
