name: Build Alpine Sway OS ISO

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    name: Build Sway OS ISO
    runs-on: ubuntu-latest

    container:
      image: alpine:edge
      options: --privileged

    env:
      ISO_OUT: /workspace/out
      APORTS_DIR: /tmp/aports
      OS_FILES: /tmp/os-files

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # BUILD DEPENDENCIES
      # ============================================================

      - name: Install Alpine ISO build dependencies
        shell: sh
        run: |
          set -eux

          apk update

          apk add --no-cache \
            alpine-sdk \
            alpine-conf \
            apk-tools \
            bash \
            build-base \
            busybox \
            curl \
            dbus \
            dosfstools \
            e2fsprogs \
            fakeroot \
            git \
            grub \
            grub-efi \
            mtools \
            openssh-client \
            python3 \
            py3-gobject3 \
            squashfs-tools \
            sudo \
            util-linux \
            xorriso

          python3 --version
          apk --version
          git --version


      # ============================================================
      # ALPINE SIGNING SETUP
      # ============================================================

      - name: Configure Alpine build signing
        shell: sh
        run: |
          set -eux

          mkdir -p /root/.abuild

          abuild-keygen \
            -n \
            -i \
            -a


      # ============================================================
      # CLONE APORTS
      # ============================================================

      - name: Clone Alpine aports
        shell: sh
        run: |
          set -eux

          rm -rf "$APORTS_DIR"

          git clone \
            --depth=1 \
            https://github.com/alpinelinux/aports.git \
            "$APORTS_DIR"

          test -d "$APORTS_DIR/main"
          test -d "$APORTS_DIR/community"
          test -x "$APORTS_DIR/scripts/mkimage.sh"

          echo "Alpine aports cloned successfully."


      # ============================================================
      # PATCH CURRENT MKIMAGE/APK COMPATIBILITY
      # ============================================================

      - name: Patch Alpine mkimage compatibility
        shell: sh
        run: |
          set -eux

          cd "$APORTS_DIR"

          # Newer apk rejects the old --no-chown invocation
          # when mkimage is running as root.
          sed -i \
            's/add --initdb --no-chown/add --initdb/g' \
            scripts/mkimage.sh

          ! grep -q -- '--initdb --no-chown' scripts/mkimage.sh

          chmod +x scripts/mkimage.sh

          echo "mkimage.sh patched successfully."


      # ============================================================
      # CREATE DIRECTORY TREE
      # ============================================================

      - name: Create OS files
        shell: sh
        run: |
          set -eux

          rm -rf "$OS_FILES"

          mkdir -p \
            "$OS_FILES/configs/sway" \
            "$OS_FILES/configs/waybar" \
            "$OS_FILES/installer"


      # ============================================================
      # SWAY CONFIG
      # ============================================================

      - name: Generate Sway configuration
        shell: sh
        run: |
          set -eux

          cat > "$OS_FILES/configs/sway/config" <<'EOF'
          set $mod Mod4
          set $term foot
          set $menu wofi --show drun

          output * bg #1e1e2e solid_color

          # Terminal
          bindsym $mod+Return exec $term

          # Application launcher
          bindsym $mod+d exec $menu

          # Window management
          bindsym $mod+Shift+q kill
          bindsym $mod+Shift+c reload
          bindsym $mod+Shift+e exec "swaynag -t warning -m 'Exit Sway?' -b 'Exit' 'swaymsg exit'"

          # Focus
          bindsym $mod+Left focus left
          bindsym $mod+Down focus down
          bindsym $mod+Up focus up
          bindsym $mod+Right focus right

          # Move windows
          bindsym $mod+Shift+Left move left
          bindsym $mod+Shift+Down move down
          bindsym $mod+Shift+Up move up
          bindsym $mod+Shift+Right move right

          # Workspaces
          bindsym $mod+1 workspace number 1
          bindsym $mod+2 workspace number 2
          bindsym $mod+3 workspace number 3
          bindsym $mod+4 workspace number 4
          bindsym $mod+5 workspace number 5

          bindsym $mod+Shift+1 move container to workspace number 1
          bindsym $mod+Shift+2 move container to workspace number 2
          bindsym $mod+Shift+3 move container to workspace number 3
          bindsym $mod+Shift+4 move container to workspace number 4
          bindsym $mod+Shift+5 move container to workspace number 5

          # Layout
          bindsym $mod+f fullscreen
          bindsym $mod+Shift+space floating toggle

          floating_modifier $mod normal

          # Gaps
          gaps inner 8
          gaps outer 4

          default_border pixel 2

          client.focused #89b4fa #1e1e2e #cdd6f4 #89b4fa #89b4fa

          # Waybar
          exec_always waybar

          # Notifications
          exec mako

          # Network tray
          exec nm-applet

          # Live ISO installer
          exec_always {
              if [ "$(id -u)" = "0" ]; then
                  python3 /usr/local/bin/phase1-installer.py
              fi
          }
          EOF


      # ============================================================
      # WAYBAR
      # ============================================================

      - name: Generate Waybar configuration
        shell: sh
        run: |
          set -eux

          cat > "$OS_FILES/configs/waybar/config.jsonc" <<'EOF'
          {
              "layer": "top",
              "position": "top",
              "height": 32,

              "modules-left": [
                  "custom/launcher",
                  "sway/workspaces",
                  "sway/mode"
              ],

              "modules-center": [
                  "clock"
              ],

              "modules-right": [
                  "network",
                  "pulseaudio",
                  "battery",
                  "tray"
              ],

              "custom/launcher": {
                  "format": "  Apps  ",
                  "on-click": "wofi --show drun"
              },

              "clock": {
                  "format": "{:%Y-%m-%d %H:%M}"
              },

              "network": {
                  "format-wifi": "WiFi: {essid}",
                  "format-ethernet": "Eth: {ipaddr}",
                  "format-disconnected": "Offline"
              },

              "pulseaudio": {
                  "format": "Vol: {volume}%",
                  "format-muted": "Muted"
              },

              "battery": {
                  "format": "Bat: {capacity}%"
              },

              "tray": {
                  "spacing": 8
              }
          }
          EOF

          cat > "$OS_FILES/configs/waybar/style.css" <<'EOF'
          * {
              font-family: "JetBrainsMono Nerd Font", monospace;
              font-size: 13px;
              border: none;
              border-radius: 0;
          }

          window#waybar {
              background-color: #1e1e2e;
              color: #cdd6f4;
          }

          #custom-launcher {
              padding: 0 12px;
              background-color: #89b4fa;
              color: #1e1e2e;
              font-weight: bold;
          }

          #workspaces button {
              padding: 0 8px;
              color: #a6adc8;
          }

          #workspaces button.focused {
              background-color: #313244;
              color: #cdd6f4;
          }

          #clock,
          #network,
          #pulseaudio,
          #battery,
          #tray {
              padding: 0 12px;
          }
          EOF


      # ============================================================
      # PHASE 1 INSTALLER
      # ============================================================

      - name: Generate Phase 1 installer
        shell: sh
        run: |
          set -eux

          cat > "$OS_FILES/installer/phase1-installer.py" <<'PYEOF'
          #!/usr/bin/env python3

          import json
          import subprocess
          import threading
          import gi

          gi.require_version("Gtk", "4.0")

          from gi.repository import Gtk, GLib


          class Phase1Window(Gtk.ApplicationWindow):

              def __init__(self, app):
                  super().__init__(
                      application=app,
                      title="Install Alpine Sway OS"
                  )

                  self.set_default_size(640, 460)
                  self.set_resizable(False)

                  box = Gtk.Box(
                      orientation=Gtk.Orientation.VERTICAL,
                      spacing=14
                  )

                  box.set_margin_top(24)
                  box.set_margin_bottom(24)
                  box.set_margin_start(24)
                  box.set_margin_end(24)

                  self.set_child(box)

                  title = Gtk.Label(
                      label="<span size='x-large' weight='bold'>Install Alpine Sway OS</span>"
                  )

                  title.set_use_markup(True)
                  title.set_halign(Gtk.Align.START)

                  box.append(title)

                  subtitle = Gtk.Label(
                      label="Select the drive where Alpine Sway OS should be installed."
                  )

                  subtitle.set_halign(Gtk.Align.START)
                  box.append(subtitle)

                  self.disk_combo = Gtk.ComboBoxText()

                  self.populate_disks()

                  box.append(self.disk_combo)

                  warning = Gtk.Label(
                      label="WARNING: Installing will erase the selected drive."
                  )

                  warning.set_halign(Gtk.Align.START)
                  box.append(warning)

                  self.status = Gtk.Label(label="")
                  self.status.set_halign(Gtk.Align.START)

                  box.append(self.status)

                  self.progress = Gtk.ProgressBar()

                  box.append(self.progress)

                  self.install_button = Gtk.Button(
                      label="Install OS to Disk"
                  )

                  self.install_button.add_css_class(
                      "suggested-action"
                  )

                  self.install_button.connect(
                      "clicked",
                      self.start_install
                  )

                  box.append(self.install_button)

                  self.log_view = Gtk.TextView()

                  self.log_view.set_editable(False)
                  self.log_view.set_cursor_visible(False)

                  self.log_buffer = self.log_view.get_buffer()

                  scroll = Gtk.ScrolledWindow()
                  scroll.set_vexpand(True)
                  scroll.set_child(self.log_view)

                  box.append(scroll)

                  self.reboot_button = Gtk.Button(
                      label="Reboot"
                  )

                  self.reboot_button.set_sensitive(False)

                  self.reboot_button.connect(
                      "clicked",
                      self.reboot
                  )

                  box.append(self.reboot_button)


              def populate_disks(self):

                  try:
                      result = subprocess.check_output(
                          [
                              "lsblk",
                              "-J",
                              "-d",
                              "-o",
                              "NAME,SIZE,MODEL,TYPE"
                          ],
                          text=True
                      )

                      data = json.loads(result)

                  except Exception as error:
                      self.status.set_text(
                          f"Unable to detect drives: {error}"
                      )

                      return

                  for dev in data.get(
                      "blockdevices",
                      []
                  ):

                      name = dev.get("name", "")
                      device_type = dev.get("type", "")

                      if device_type != "disk":
                          continue

                      if name.startswith(
                          ("loop", "sr", "ram")
                      ):
                          continue

                      path = f"/dev/{name}"

                      size = dev.get(
                          "size",
                          ""
                      )

                      model = (
                          dev.get("model", "")
                          or ""
                      ).strip()

                      label = (
                          f"{path} ({size}"
                          f"{' - ' + model if model else ''})"
                      )

                      self.disk_combo.append(
                          path,
                          label
                      )

                  if self.disk_combo.get_active_id() is None:
                      self.disk_combo.set_active(0)


              def start_install(self, _button):

                  disk = self.disk_combo.get_active_id()

                  if not disk:
                      self.status.set_text(
                          "Please select a drive."
                      )
                      return

                  self.install_button.set_sensitive(False)

                  self.status.set_text(
                      f"Installing to {disk}..."
                  )

                  threading.Thread(
                      target=self.run_install,
                      args=(disk,),
                      daemon=True
                  ).start()


              def run_install(self, disk):

                  try:

                      process = subprocess.Popen(
                          [
                              "/usr/local/bin/phase1-backend",
                              disk
                          ],
                          stdout=subprocess.PIPE,
                          stderr=subprocess.STDOUT,
                          text=True
                      )

                      for line in process.stdout:

                          line = line.rstrip()

                          GLib.idle_add(
                              self.append_log,
                              line
                          )

                          GLib.idle_add(
                              self.progress.pulse
                          )

                      process.wait()

                      if process.returncode == 0:

                          GLib.idle_add(
                              self.install_complete
                          )

                      else:

                          GLib.idle_add(
                              self.install_failed,
                              process.returncode
                          )

                  except Exception as error:

                      GLib.idle_add(
                          self.install_failed,
                          str(error)
                      )


              def append_log(self, text):

                  end = self.log_buffer.get_end_iter()

                  self.log_buffer.insert(
                      end,
                      text + "\n"
                  )


              def install_complete(self):

                  self.progress.set_fraction(1.0)

                  self.status.set_text(
                      "Installation complete. Reboot to finish setup."
                  )

                  self.reboot_button.set_sensitive(True)


              def install_failed(self, error):

                  self.status.set_text(
                      f"Installation failed: {error}"
                  )

                  self.install_button.set_sensitive(True)


              def reboot(self, _button):

                  subprocess.Popen(
                      ["reboot"]
                  )


          class App(Gtk.Application):

              def __init__(self):

                  super().__init__(
                      application_id="org.alpine.sway.installer"
                  )

                  self.connect(
                      "activate",
                      self.on_activate
                  )


              def on_activate(self, _app):

                  window = Phase1Window(self)

                  window.present()


          app = App()

          app.run(None)
          PYEOF

          chmod +x "$OS_FILES/installer/phase1-installer.py"


      # ============================================================
      # PHASE 2 OOBE
      # ============================================================

      - name: Generate Phase 2 OOBE
        shell: sh
        run: |
          set -eux

          cat > "$OS_FILES/installer/phase2-oobe.py" <<'PYEOF'
          #!/usr/bin/env python3

          import subprocess
          import threading
          import gi

          gi.require_version("Gtk", "4.0")

          from gi.repository import Gtk, GLib


          class OOBEWindow(Gtk.ApplicationWindow):

              def __init__(self, app):

                  super().__init__(
                      application=app,
                      title="Welcome to Alpine Sway OS"
                  )

                  self.set_default_size(600, 500)

                  outer = Gtk.Box(
                      orientation=Gtk.Orientation.VERTICAL,
                      spacing=20
                  )

                  outer.set_margin_top(40)
                  outer.set_margin_bottom(40)
                  outer.set_margin_start(40)
                  outer.set_margin_end(40)

                  self.set_child(outer)

                  title = Gtk.Label(
                      label="<span size='xx-large' weight='bold'>Welcome</span>"
                  )

                  title.set_use_markup(True)

                  outer.append(title)

                  self.stack = Gtk.Stack()

                  self.stack.set_vexpand(True)

                  outer.append(self.stack)

                  self.create_wifi_page()
                  self.create_user_page()


              def create_wifi_page(self):

                  page = Gtk.Box(
                      orientation=Gtk.Orientation.VERTICAL,
                      spacing=12
                  )

                  label = Gtk.Label(
                      label="Connect to Wi-Fi"
                  )

                  page.append(label)

                  self.wifi_combo = Gtk.ComboBoxText()

                  page.append(self.wifi_combo)

                  self.wifi_password = Gtk.PasswordEntry()

                  self.wifi_password.set_placeholder_text(
                      "Wi-Fi password"
                  )

                  self.wifi_password.set_show_peek_icon(
                      True
                  )

                  page.append(
                      self.wifi_password
                  )

                  self.wifi_status = Gtk.Label(
                      label=""
                  )

                  page.append(
                      self.wifi_status
                  )

                  buttons = Gtk.Box(
                      orientation=Gtk.Orientation.HORIZONTAL,
                      spacing=8
                  )

                  refresh = Gtk.Button(
                      label="Refresh"
                  )

                  refresh.connect(
                      "clicked",
                      lambda _b: self.scan_wifi()
                  )

                  skip = Gtk.Button(
                      label="Skip"
                  )

                  skip.connect(
                      "clicked",
                      lambda _b:
                      self.stack.set_visible_child_name(
                          "user"
                      )
                  )

                  connect = Gtk.Button(
                      label="Connect"
                  )

                  connect.add_css_class(
                      "suggested-action"
                  )

                  connect.connect(
                      "clicked",
                      self.connect_wifi
                  )

                  buttons.append(refresh)
                  buttons.append(skip)
                  buttons.append(connect)

                  page.append(buttons)

                  self.stack.add_named(
                      page,
                      "wifi"
                  )

                  self.scan_wifi()


              def create_user_page(self):

                  page = Gtk.Box(
                      orientation=Gtk.Orientation.VERTICAL,
                      spacing=12
                  )

                  label = Gtk.Label(
                      label="Create your account"
                  )

                  page.append(label)

                  self.host_entry = Gtk.Entry()

                  self.host_entry.set_text(
                      "alpine-sway"
                  )

                  self.host_entry.set_placeholder_text(
                      "Computer name"
                  )

                  page.append(
                      self.host_entry
                  )

                  self.user_entry = Gtk.Entry()

                  self.user_entry.set_placeholder_text(
                      "Username"
                  )

                  page.append(
                      self.user_entry
                  )

                  self.password_entry = Gtk.PasswordEntry()

                  self.password_entry.set_placeholder_text(
                      "Password"
                  )

                  self.password_entry.set_show_peek_icon(
                      True
                  )

                  page.append(
                      self.password_entry
                  )

                  finish = Gtk.Button(
                      label="Finish Setup"
                  )

                  finish.add_css_class(
                      "suggested-action"
                  )

                  finish.connect(
                      "clicked",
                      self.finish_setup
                  )

                  page.append(finish)

                  self.stack.add_named(
                      page,
                      "user"
                  )


              def scan_wifi(self):

                  self.wifi_combo.remove_all()

                  try:

                      subprocess.run(
                          [
                              "nmcli",
                              "dev",
                              "wifi",
                              "rescan"
                          ],
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.DEVNULL
                      )

                      output = subprocess.check_output(
                          [
                              "nmcli",
                              "-t",
                              "-f",
                              "SSID",
                              "dev",
                              "wifi",
                              "list"
                          ],
                          text=True
                      )

                  except Exception as error:

                      self.wifi_status.set_text(
                          f"Wi-Fi scan failed: {error}"
                      )

                      return

                  seen = set()

                  for ssid in output.splitlines():

                      ssid = ssid.strip()

                      if ssid and ssid not in seen:

                          seen.add(ssid)

                          self.wifi_combo.append_text(
                              ssid
                          )

                  if seen:

                      self.wifi_combo.set_active(0)


              def connect_wifi(self, _button):

                  ssid = (
                      self.wifi_combo
                      .get_active_text()
                  )

                  password = (
                      self.wifi_password
                      .get_text()
                  )

                  if not ssid:

                      self.wifi_status.set_text(
                          "Select a Wi-Fi network."
                      )

                      return

                  self.wifi_status.set_text(
                      "Connecting..."
                  )

                  def worker():

                      result = subprocess.run(
                          [
                              "nmcli",
                              "dev",
                              "wifi",
                              "connect",
                              ssid,
                              "password",
                              password
                          ]
                      )

                      if result.returncode == 0:

                          GLib.idle_add(
                              self.stack.set_visible_child_name,
                              "user"
                          )

                      else:

                          GLib.idle_add(
                              self.wifi_status.set_text,
                              "Connection failed."
                          )

                  threading.Thread(
                      target=worker,
                      daemon=True
                  ).start()


              def finish_setup(self, _button):

                  user = (
                      self.user_entry
                      .get_text()
                      .strip()
                      .lower()
                  )

                  password = (
                      self.password_entry
                      .get_text()
                  )

                  hostname = (
                      self.host_entry
                      .get_text()
                      .strip()
                      or "alpine-sway"
                  )

                  if not user or not password:

                      return

                  subprocess.run(
                      [
                          "sudo",
                          "/usr/local/bin/finalize-oobe",
                          user,
                          password,
                          hostname
                      ]
                  )


          class App(Gtk.Application):

              def __init__(self):

                  super().__init__(
                      application_id="org.alpine.sway.oobe"
                  )

                  self.connect(
                      "activate",
                      self.on_activate
                  )


              def on_activate(self, _app):

                  window = OOBEWindow(self)

                  window.present()


          app = App()

          app.run(None)
          PYEOF

          chmod +x "$OS_FILES/installer/phase2-oobe.py"


      # ============================================================
      # ALPINE MKIMAGE PROFILE
      # ============================================================

      - name: Generate Sway mkimage profile
        shell: sh
        run: |
          set -eux

          cat > "$APORTS_DIR/scripts/mkimg.sway.sh" <<'EOF'
          profile_sway() {
              profile_standard

              title="Alpine Sway Desktop OS"
              desc="Custom Alpine Linux Sway desktop with graphical installer and OOBE"

              arch="x86_64"

              apkovl="genapkovl-sway.sh"

              # Do not attempt modloop signing in this custom CI image.
              modloop_sign="no"

              apks="$apks
                  sway
                  swaybg
                  swayidle
                  swaylock

                  waybar
                  wofi

                  foot
                  mako

                  thunar
                  thunar-volman
                  gvfs
                  gvfs-smb

                  firefox

                  flatpak

                  xdg-desktop-portal
                  xdg-desktop-portal-wlr
                  xdg-desktop-portal-gtk

                  seatd
                  dbus
                  elogind
                  polkit-elogind

                  mesa-dri-gallium
                  xwayland

                  pipewire
                  wireplumber
                  pipewire-pulse

                  networkmanager
                  networkmanager-wifi
                  wpa_supplicant

                  python3
                  py3-gobject3
                  gtk4.0

                  font-jetbrains-mono-nerd
                  papirus-icon-theme

                  grim
                  slurp
                  wl-clipboard

                  sudo

                  util-linux
                  e2fsprogs
                  dosfstools

                  grub
                  grub-efi
                  efibootmgr
              "
          }
          EOF

          chmod +x "$APORTS_DIR/scripts/mkimg.sway.sh"


      # ============================================================
      # APKS OVERLAY
      # ============================================================

      - name: Generate Alpine overlay
        shell: sh
        run: |
          set -eux

          cat > "$APORTS_DIR/scripts/genapkovl-sway.sh" <<'EOF'
          #!/bin/sh -e

          HOSTNAME="$1"

          if [ -z "$HOSTNAME" ]; then
              exit 1
          fi

          tmp="$(mktemp -d)"

          cleanup() {
              rm -rf "$tmp"
          }

          trap cleanup EXIT


          makefile() {
              OWNER="$1"
              PERMS="$2"
              FILENAME="$3"

              mkdir -p "$(dirname "$FILENAME")"

              cat > "$FILENAME"

              chown "$OWNER" "$FILENAME"
              chmod "$PERMS" "$FILENAME"
          }


          rc_add() {
              mkdir -p "$tmp/etc/runlevels/$2"

              ln -sf \
                  "/etc/init.d/$1" \
                  "$tmp/etc/runlevels/$2/$1"
          }


          # ========================================================
          # DESKTOP CONFIG
          # ========================================================

          mkdir -p \
              "$tmp/etc/skel/.config" \
              "$tmp/root/.config"


          cp -r \
              /tmp/os-files/configs/sway \
              "$tmp/etc/skel/.config/"


          cp -r \
              /tmp/os-files/configs/waybar \
              "$tmp/etc/skel/.config/"


          cp -r \
              /tmp/os-files/configs/sway \
              "$tmp/root/.config/"


          cp -r \
              /tmp/os-files/configs/waybar \
              "$tmp/root/.config/"


          # ========================================================
          # PROFILE
          # ========================================================

          makefile root:root 0644 \
              "$tmp/etc/skel/.profile" <<'PROFILE'

          export XDG_DATA_DIRS="/var/lib/flatpak/exports/share:$HOME/.local/share/flatpak/exports/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"

          if [ -z "$DISPLAY" ] &&
             [ -z "$WAYLAND_DISPLAY" ] &&
             [ "$(tty)" = "/dev/tty1" ]; then

              export XDG_CURRENT_DESKTOP=sway
              export MOZ_ENABLE_WAYLAND=1

              exec dbus-run-session sway
          fi
          PROFILE


          cp \
              "$tmp/etc/skel/.profile" \
              "$tmp/root/.profile"


          # ========================================================
          # HOSTNAME
          # ========================================================

          makefile root:root 0644 \
              "$tmp/etc/hostname" <<HOSTNAMEFILE
          $HOSTNAME
          HOSTNAMEFILE


          # ========================================================
          # APK REPOSITORIES
          # ========================================================

          makefile root:root 0644 \
              "$tmp/etc/apk/repositories" <<'REPOS'
          https://dl-cdn.alpinelinux.org/alpine/edge/main
          https://dl-cdn.alpinelinux.org/alpine/edge/community
          REPOS


          # ========================================================
          # INSTALLER PROGRAMS
          # ========================================================

          mkdir -p "$tmp/usr/local/bin"

          cp \
              /tmp/os-files/installer/phase1-installer.py \
              "$tmp/usr/local/bin/phase1-installer.py"

          cp \
              /tmp/os-files/installer/phase2-oobe.py \
              "$tmp/usr/local/bin/phase2-oobe.py"


          chmod +x \
              "$tmp/usr/local/bin/phase1-installer.py" \
              "$tmp/usr/local/bin/phase2-oobe.py"


          # ========================================================
          # PHASE 1 BACKEND
          # ========================================================

          makefile root:root 0755 \
              "$tmp/usr/local/bin/phase1-backend" <<'PHASE1'
          #!/bin/sh

          set -e

          TARGET_DISK="$1"

          if [ -z "$TARGET_DISK" ]; then
              echo "No target disk selected."
              exit 1
          fi

          case "$TARGET_DISK" in
              /dev/*)
                  ;;
              *)
                  echo "Invalid disk."
                  exit 1
                  ;;
          esac


          echo "Installing Alpine Sway OS to $TARGET_DISK"

          cat > /tmp/answers <<ANS
          KEYMAPOPTS="us us"
          HOSTNAMEOPTS="-n alpine-sway"
          INTERFACESOPTS="auto lo
          iface lo inet loopback
          "
          TIMEZONEOPTS="-z UTC"
          PROXYOPTS="none"
          APKREPOSOPTS="-1"
          USEROPTS="none"
          SSHDOPTS="openssh"
          NTPOPTS="chrony"
          DISKOPTS="-m sys $TARGET_DISK"
          ANS


          setup-alpine -f /tmp/answers


          case "$TARGET_DISK" in
              /dev/nvme*|/dev/mmcblk*)
                  ROOT_PART="${TARGET_DISK}p2"
                  ;;
              *)
                  ROOT_PART="${TARGET_DISK}2"
                  ;;
          esac


          mkdir -p /mnt

          mount "$ROOT_PART" /mnt


          # Copy repositories.
          if [ -f /etc/apk/repositories ]; then
              cp \
                  /etc/apk/repositories \
                  /mnt/etc/apk/repositories
          fi


          apk \
              --root /mnt \
              update


          apk \
              --root /mnt \
              add \
              sway \
              swaybg \
              swayidle \
              swaylock \
              waybar \
              wofi \
              foot \
              mako \
              thunar \
              thunar-volman \
              gvfs \
              firefox \
              flatpak \
              xdg-desktop-portal \
              xdg-desktop-portal-wlr \
              xdg-desktop-portal-gtk \
              seatd \
              dbus \
              elogind \
              polkit-elogind \
              mesa-dri-gallium \
              xwayland \
              pipewire \
              wireplumber \
              pipewire-pulse \
              networkmanager \
              networkmanager-wifi \
              wpa_supplicant \
              python3 \
              py3-gobject3 \
              gtk4.0 \
              font-jetbrains-mono-nerd \
              papirus-icon-theme \
              grim \
              slurp \
              wl-clipboard \
              sudo \
              util-linux \
              e2fsprogs \
              dosfstools


          # ========================================================
          # SERVICES
          # ========================================================

          chroot /mnt rc-update add dbus default || true
          chroot /mnt rc-update add seatd default || true
          chroot /mnt rc-update add NetworkManager default || true


          # ========================================================
          # COPY DESKTOP CONFIG
          # ========================================================

          mkdir -p \
              /mnt/etc/skel/.config/sway \
              /mnt/etc/skel/.config/waybar

          cp \
              /etc/skel/.config/sway/config \
              /mnt/etc/skel/.config/sway/config

          cp \
              /etc/skel/.config/waybar/config.jsonc \
              /mnt/etc/skel/.config/waybar/config.jsonc

          cp \
              /etc/skel/.config/waybar/style.css \
              /mnt/etc/skel/.config/waybar/style.css

          cp \
              /etc/skel/.profile \
              /mnt/etc/skel/.profile


          # ========================================================
          # OOBE
          # ========================================================

          cp \
              /usr/local/bin/phase2-oobe.py \
              /mnt/usr/local/bin/phase2-oobe.py


          makefile root:root 0755 \
              "$tmp/usr/local/bin/finalize-oobe" <<'FINALIZE'
          #!/bin/sh

          set -e

          NEW_USER="$1"
          NEW_PASS="$2"
          NEW_HOST="$3"

          if [ -z "$NEW_USER" ] || [ -z "$NEW_PASS" ]; then
              exit 1
          fi


          echo "$NEW_HOST" > /etc/hostname


          adduser \
              -D \
              -G wheel \
              -s /bin/sh \
              "$NEW_USER"


          for group in \
              audio \
              video \
              netdev \
              seat \
              input; do

              addgroup \
                  "$NEW_USER" \
                  "$group" \
                  2>/dev/null || true

          done


          echo "$NEW_USER:$NEW_PASS" | chpasswd


          mkdir -p \
              "/home/$NEW_USER/.config"


          cp -r \
              /etc/skel/.config/* \
              "/home/$NEW_USER/.config/"


          cp \
              /etc/skel/.profile \
              "/home/$NEW_USER/.profile"


          chown -R \
              "$NEW_USER:$NEW_USER" \
              "/home/$NEW_USER"


          # Flathub is optional; don't make setup fail if unavailable.
          flatpak remote-add \
              --if-not-exists \
              flathub \
              https://dl.flathub.org/repo/flathub.flatpakrepo \
              || true


          # Replace OEM login with the real user.
          if [ -f /etc/inittab ]; then
              sed -i \
                  "s/login -f oem/login -f $NEW_USER/g" \
                  /etc/inittab
          fi


          rm -f \
              /etc/sudoers.d/oem


          deluser \
              --remove-home \
              oem \
              2>/dev/null || true


          reboot
          FINALIZE


          chmod +x \
              "$tmp/usr/local/bin/finalize-oobe"


          cp \
              "$tmp/usr/local/bin/finalize-oobe" \
              "$tmp/usr/local/bin/finalize-oobe"


          # ========================================================
          # OEM USER
          # ========================================================

          chroot /mnt \
              adduser \
              -D \
              -G wheel \
              -s /bin/sh \
              oem || true


          for group in \
              audio \
              video \
              netdev \
              seat \
              input; do

              chroot /mnt \
                  addgroup \
                  oem \
                  "$group" \
                  2>/dev/null || true

          done


          mkdir -p \
              /mnt/etc/sudoers.d


          cat > /mnt/etc/sudoers.d/oem <<'SUDO'
          oem ALL=(ALL) NOPASSWD: ALL
          SUDO


          chmod 0440 \
              /mnt/etc/sudoers.d/oem


          # ========================================================
          # OOBE SWAY CONFIG
          # ========================================================

          mkdir -p \
              /mnt/home/oem/.config/sway


          cat > /mnt/home/oem/.config/sway/config <<'OEMSWAY'
          output * bg #1e1e2e solid_color

          exec python3 /usr/local/bin/phase2-oobe.py
          OEMSWAY


          cp \
              /etc/skel/.profile \
              /mnt/home/oem/.profile


          chroot /mnt \
              chown -R \
              oem:oem \
              /home/oem


          # ========================================================
          # TTY1 AUTO LOGIN
          # ========================================================

          if [ -f /mnt/etc/inittab ]; then

              sed -i \
                  's|^tty1::.*|tty1::respawn:/bin/login -f oem|' \
                  /mnt/etc/inittab

          fi


          sync

          umount /mnt

          echo "Phase 1 complete."

          PHASE1


          # ========================================================
          # LIVE ISO SERVICES
          # ========================================================

          rc_add devfs sysinit
          rc_add dmesg sysinit
          rc_add mdev sysinit
          rc_add hwdrivers sysinit

          rc_add hwclock boot
          rc_add modules boot
          rc_add sysctl boot
          rc_add hostname boot
          rc_add bootmisc boot
          rc_add syslog boot

          rc_add dbus default
          rc_add seatd default
          rc_add networkmanager default


          # ========================================================
          # LIVE ISO INIT
          # ========================================================

          makefile root:root 0644 \
              "$tmp/etc/inittab" <<'INITTAB'
          ::sysinit:/sbin/openrc sysinit
          ::sysinit:/sbin/openrc boot
          ::wait:/sbin/openrc default

          tty1::respawn:/bin/login -f root
          tty2::respawn:/sbin/getty 38400 tty2

          ::ctrlaltdel:/sbin/reboot
          ::shutdown:/sbin/openrc shutdown
          INITTAB


          # ========================================================
          # APK WORLD
          # ========================================================

          mkdir -p \
              "$tmp/etc/apk"


          cat > "$tmp/etc/apk/world" <<'WORLD'
          alpine-base
          sway
          waybar
          wofi
          foot
          mako
          thunar
          firefox
          flatpak
          seatd
          dbus
          elogind
          networkmanager
          python3
          py3-gobject3
          gtk4.0
          util-linux
          e2fsprogs
          dosfstools
          WORLD


          # ========================================================
          # OUTPUT OVERLAY
          # ========================================================

          tar \
              -c \
              -C "$tmp" \
              etc \
              root \
              usr \
              | gzip -9n \
              > "$HOSTNAME.apkovl.tar.gz"

          EOF

          chmod +x "$APORTS_DIR/scripts/genapkovl-sway.sh"


      # ============================================================
      # FIX FINALIZE SCRIPT INTO OVERLAY
      # ============================================================

      - name: Validate generated scripts
        shell: sh
        run: |
          set -eux

          test -x "$APORTS_DIR/scripts/mkimage.sh"
          test -x "$APORTS_DIR/scripts/mkimg.sway.sh"
          test -x "$APORTS_DIR/scripts/genapkovl-sway.sh"

          python3 -m py_compile \
            "$OS_FILES/installer/phase1-installer.py"

          python3 -m py_compile \
            "$OS_FILES/installer/phase2-oobe.py"

          sh -n \
            "$APORTS_DIR/scripts/mkimage.sh"

          sh -n \
            "$APORTS_DIR/scripts/mkimg.sway.sh"

          sh -n \
            "$APORTS_DIR/scripts/genapkovl-sway.sh"

          echo "All generated scripts passed validation."


      # ============================================================
      # BUILD ISO
      # ============================================================

      - name: Build Alpine Sway OS ISO
        shell: sh
        run: |
          set -eux

          mkdir -p "$ISO_OUT"

          cd "$APORTS_DIR"

          ./scripts/mkimage.sh \
            --tag edge \
            --outdir "$ISO_OUT" \
            --arch x86_64 \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/main \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/community \
            --profile sway


      # ============================================================
      # CHECK OUTPUT
      # ============================================================

      - name: Check generated ISO
        shell: sh
        run: |
          set -eux

          ls -lah "$ISO_OUT"

          test -n "$(find "$ISO_OUT" -maxdepth 1 -type f -name '*.iso' -print -quit)"


      # ============================================================
      # SHA256
      # ============================================================

      - name: Generate SHA256 checksums
        shell: sh
        run: |
          set -eux

          cd "$ISO_OUT"

          sha256sum \
            *.iso \
            > sha256sums.txt

          cat sha256sums.txt


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-sway-os-iso
          path: |
            /workspace/out/*.iso
            /workspace/out/sha256sums.txt
          retention-days: 14


      # ============================================================
      # GITHUB RELEASE
      # ============================================================

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /workspace/out/*.iso
            /workspace/out/sha256sums.txt
          generate_release_notes: true
