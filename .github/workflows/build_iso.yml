name: Build Alpine Sway ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: alpine:edge

    steps:
      - name: Install build dependencies
        shell: sh
        run: |
          set -eux

          apk update

          apk add --no-cache \
            alpine-sdk \
            bash \
            build-base \
            ca-certificates \
            curl \
            git \
            openssl \
            squashfs-tools \
            xorriso \
            grub \
            grub-bios \
            grub-efi \
            mtools \
            dosfstools \
            util-linux \
            e2fsprogs \
            python3 \
            py3-gobject3 \
            gtk4.0

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Alpine aports
        shell: sh
        run: |
          set -eux

          rm -rf /tmp/aports

          git clone --depth 1 \
            https://github.com/alpinelinux/aports.git \
            /tmp/aports

      - name: Create APK signing key
        shell: sh
        run: |
          set -eux

          mkdir -p /root/.abuild
          mkdir -p /etc/apk/keys

          if [ ! -f /root/.abuild/alpineos.rsa ]; then
            abuild-keygen \
              -a \
              -n alpineos \
              -i \
              -q
          fi

          cp /root/.abuild/alpineos.rsa.pub /etc/apk/keys/

          export PACKAGER_PRIVKEY=/root/.abuild/alpineos.rsa
          export PACKAGER_PUBKEY=/root/.abuild/alpineos.rsa.pub

          echo "PACKAGER_PRIVKEY=/root/.abuild/alpineos.rsa" >> "$GITHUB_ENV"
          echo "PACKAGER_PUBKEY=/root/.abuild/alpineos.rsa.pub" >> "$GITHUB_ENV"

          ls -l /root/.abuild/
          ls -l /etc/apk/keys/

      - name: Create custom Sway profile
        shell: sh
        run: |
          set -eux

          PROFILE="/tmp/aports/scripts/genapkovl-sway.sh"

          mkdir -p "$(dirname "$PROFILE")"

          cat > "$PROFILE" <<'PROFILE'
          #!/bin/sh

          profile_sway() {
              profile_standard

              title="Alpine Sway OS"
              desc="Custom Alpine Linux Sway desktop ISO"

              apks="
          alpine-base
          alpine-conf
          alpine-sdk
          busybox
          openrc
          linux-lts
          linux-firmware
          wireless-regdb

          sway
          swaybg
          swayidle
          swaylock
          waybar
          foot

          dbus
          dbus-openrc
          dbus-x11

          seatd
          seatd-openrc

          elogind
          elogind-openrc

          networkmanager
          networkmanager-cli
          networkmanager-openrc

          python3
          py3-gobject3
          gtk4.0

          util-linux
          e2fsprogs
          dosfstools
          parted

          bash
          curl
          wget
          git
          nano
          vim

          pciutils
          usbutils

          "

              initfs_features="ata base cdrom ext4 kms mmc nvme scsi usb"

              kernel_addons=""

              boot_addons=""

              modloop_sign="yes"

              hostname="alpine-sway"

              mkimg_squashfs_opts="-comp xz"

              apkovl="genapkovl-sway.sh"
          }

          profile_sway
          PROFILE

          chmod +x "$PROFILE"

      - name: Create Sway configuration overlay
        shell: sh
        run: |
          set -eux

          TMP="/tmp/sway-overlay"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          mkdir -p "$TMP/etc"
          mkdir -p "$TMP/etc/profile.d"
          mkdir -p "$TMP/etc/skel"
          mkdir -p "$TMP/etc/sway"
          mkdir -p "$TMP/etc/waybar"
          mkdir -p "$TMP/etc/xdg"
          mkdir -p "$TMP/etc/xdg/autostart"
          mkdir -p "$TMP/root"
          mkdir -p "$TMP/usr/local/bin"
          mkdir -p "$TMP/usr/local/sbin"
          mkdir -p "$TMP/etc/init.d"
          mkdir -p "$TMP/etc/runlevels/default"
          mkdir -p "$TMP/etc/network"

          # ------------------------------------------------------------
          # Root profile
          # ------------------------------------------------------------

          cat > "$TMP/root/.profile" <<'PROFILE'
          export XDG_CURRENT_DESKTOP=sway
          export XDG_SESSION_TYPE=wayland
          export MOZ_ENABLE_WAYLAND=1
          PROFILE

          cp "$TMP/root/.profile" "$TMP/etc/skel/.profile"

          # ------------------------------------------------------------
          # Sway configuration
          # ------------------------------------------------------------

          cat > "$TMP/etc/sway/config" <<'SWAY'
          set $mod Mod4

          font pango:Sans 10

          output * bg #202020 solid_color

          default_border pixel 2
          default_floating_border pixel 2

          input type:keyboard {
              xkb_layout us
          }

          input type:pointer {
              accel_profile flat
          }

          exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway

          exec_always --no-startup-id waybar

          bindsym $mod+Return exec foot
          bindsym $mod+d exec foot
          bindsym $mod+Shift+q kill
          bindsym $mod+Shift+c reload
          bindsym $mod+Shift+e exec swaynag -t warning -m 'Exit Sway?' -b 'Exit' 'swaymsg exit'

          bindsym $mod+1 workspace number 1
          bindsym $mod+2 workspace number 2
          bindsym $mod+3 workspace number 3
          bindsym $mod+4 workspace number 4
          bindsym $mod+5 workspace number 5

          bindsym $mod+Shift+1 move container to workspace number 1
          bindsym $mod+Shift+2 move container to workspace number 2
          bindsym $mod+Shift+3 move container to workspace number 3
          bindsym $mod+Shift+4 move container to workspace number 4
          bindsym $mod+Shift+5 move container to workspace number 5

          bindsym $mod+f fullscreen toggle
          bindsym $mod+space floating toggle
          bindsym $mod+Shift+space focus mode_toggle

          bindsym $mod+Left focus left
          bindsym $mod+Right focus right
          bindsym $mod+Up focus up
          bindsym $mod+Down focus down

          bindsym $mod+Shift+Left move left
          bindsym $mod+Shift+Right move right
          bindsym $mod+Shift+Up move up
          bindsym $mod+Shift+Down move down

          bindsym XF86AudioRaiseVolume exec pactl set-sink-volume @DEFAULT_SINK@ +5%
          bindsym XF86AudioLowerVolume exec pactl set-sink-volume @DEFAULT_SINK@ -5%
          bindsym XF86AudioMute exec pactl set-sink-mute @DEFAULT_SINK@ toggle
          SWAY

          # ------------------------------------------------------------
          # Waybar
          # ------------------------------------------------------------

          cat > "$TMP/etc/waybar/config" <<'WAYBAR'
          {
              "layer": "top",
              "position": "top",
              "height": 30,

              "modules-left": [
                  "sway/workspaces"
              ],

              "modules-center": [
                  "clock"
              ],

              "modules-right": [
                  "network",
                  "cpu",
                  "memory"
              ],

              "clock": {
                  "format": "{:%Y-%m-%d %H:%M:%S}"
              },

              "cpu": {
                  "format": "CPU {usage}%"
              },

              "memory": {
                  "format": "RAM {}%"
              },

              "network": {
                  "format-wifi": "WiFi {essid}",
                  "format-ethernet": "Ethernet",
                  "format-disconnected": "Offline"
              }
          }
          WAYBAR

          # ------------------------------------------------------------
          # Waybar CSS
          # ------------------------------------------------------------

          cat > "$TMP/etc/waybar/style.css" <<'CSS'
          * {
              font-family: sans-serif;
              font-size: 13px;
          }

          window#waybar {
              background: rgba(20, 20, 20, 0.95);
              color: white;
          }

          #workspaces button {
              padding: 0 8px;
              color: white;
          }

          #clock,
          #cpu,
          #memory,
          #network {
              padding: 0 10px;
          }
          CSS

          # ------------------------------------------------------------
          # Login environment
          # ------------------------------------------------------------

          cat > "$TMP/etc/profile.d/sway.sh" <<'PROFILE'
          export XDG_CURRENT_DESKTOP=sway
          export XDG_SESSION_TYPE=wayland
          export MOZ_ENABLE_WAYLAND=1
          PROFILE

          chmod 644 "$TMP/etc/profile.d/sway.sh"

          # ------------------------------------------------------------
          # Phase 1 installer
          # ------------------------------------------------------------

          cat > "$TMP/usr/local/bin/phase1-installer.py" <<'PY'
          #!/usr/bin/env python3

          import os
          import subprocess
          import sys

          import gi

          gi.require_version("Gtk", "4.0")
          from gi.repository import Gtk, GLib


          class Installer(Gtk.Application):
              def __init__(self):
                  super().__init__(
                      application_id="org.alpineos.installer"
                  )

                  self.window = None
                  self.status = None
                  self.progress = None

              def do_activate(self):
                  if self.window is not None:
                      self.window.present()
                      return

                  self.window = Gtk.ApplicationWindow(
                      application=self
                  )

                  self.window.set_title(
                      "Alpine Sway OS Installer"
                  )

                  self.window.set_default_size(
                      700,
                      500
                  )

                  box = Gtk.Box(
                      orientation=Gtk.Orientation.VERTICAL,
                      spacing=12
                  )

                  box.set_margin_top(24)
                  box.set_margin_bottom(24)
                  box.set_margin_start(24)
                  box.set_margin_end(24)

                  title = Gtk.Label(
                      label="Alpine Sway OS Installer"
                  )

                  title.set_markup(
                      "<span size='xx-large'><b>"
                      "Alpine Sway OS"
                      "</b></span>"
                  )

                  box.append(title)

                  description = Gtk.Label(
                      label=(
                          "Select a disk and install "
                          "the operating system."
                      )
                  )

                  description.set_wrap(True)

                  box.append(description)

                  self.status = Gtk.Label(
                      label="Detecting disks..."
                  )

                  box.append(self.status)

                  self.progress = Gtk.ProgressBar()

                  box.append(self.progress)

                  install_button = Gtk.Button(
                      label="Install"
                  )

                  install_button.connect(
                      "clicked",
                      self.install
                  )

                  box.append(install_button)

                  self.window.set_child(box)
                  self.window.present()

                  self.detect_disks()

              def detect_disks(self):
                  try:
                      result = subprocess.run(
                          [
                              "lsblk",
                              "-dn",
                              "-o",
                              "NAME,SIZE,TYPE"
                          ],
                          capture_output=True,
                          text=True,
                          check=False
                      )

                      lines = []

                      for line in result.stdout.splitlines():
                          parts = line.split()

                          if len(parts) >= 3:
                              name = parts[0]
                              size = parts[1]
                              device_type = parts[2]

                              if device_type == "disk":
                                  lines.append(
                                      f"/dev/{name} - {size}"
                                  )

                      if lines:
                          self.status.set_text(
                              "Available disks:\n" +
                              "\n".join(lines)
                          )
                      else:
                          self.status.set_text(
                              "No disks detected."
                          )

                  except Exception as exc:
                      self.status.set_text(
                          f"Disk detection failed: {exc}"
                      )

              def install(self, _button):
                  dialog = Gtk.MessageDialog(
                      transient_for=self.window,
                      modal=True,
                      message_type=Gtk.MessageType.WARNING,
                      buttons=Gtk.ButtonsType.OK_CANCEL,
                      text="Install Alpine Sway OS?"
                  )

                  dialog.set_secondary_text(
                      "This will erase the selected target disk."
                  )

                  dialog.connect(
                      "response",
                      self.install_response
                  )

                  dialog.present()

              def install_response(self, dialog, response):
                  dialog.destroy()

                  if response != Gtk.ResponseType.OK:
                      return

                  self.status.set_text(
                      "Starting installer..."
                  )

                  self.progress.set_fraction(0.1)

                  GLib.idle_add(
                      self.run_backend
                  )

              def run_backend(self):
                  try:
                      result = subprocess.run(
                          [
                              "/usr/local/sbin/phase1-backend"
                          ],
                          capture_output=True,
                          text=True,
                          check=False
                      )

                      if result.returncode == 0:
                          self.progress.set_fraction(1.0)

                          self.status.set_text(
                              "Installation completed. "
                              "Reboot and remove the ISO."
                          )
                      else:
                          self.status.set_text(
                              "Installation failed:\n" +
                              result.stderr[-1000:]
                          )

                  except Exception as exc:
                      self.status.set_text(
                          f"Installer error: {exc}"
                      )

                  return False


          app = Installer()
          sys.exit(app.run(sys.argv))
          PY

          chmod +x "$TMP/usr/local/bin/phase1-installer.py"

          # ------------------------------------------------------------
          # Phase 1 backend
          # ------------------------------------------------------------

          cat > "$TMP/usr/local/sbin/phase1-backend" <<'SH'
          #!/bin/sh

          set -eu

          echo "Available disks:"
          lsblk -dn -o NAME,SIZE,TYPE

          echo
          echo "Run setup-alpine to install the base system."
          echo "Example:"
          echo
          echo "setup-alpine"
          echo
          echo "The graphical installer intentionally does not"
          echo "automatically erase a disk."
          SH

          chmod +x "$TMP/usr/local/sbin/phase1-backend"

          # ------------------------------------------------------------
          # NetworkManager
          # ------------------------------------------------------------

          cat > "$TMP/etc/networkmanager.conf" <<'CONF'
          [main]
          plugins=keyfile
          CONF

          # ------------------------------------------------------------
          # OpenRC services
          # ------------------------------------------------------------

          ln -sf /etc/init.d/dbus \
              "$TMP/etc/runlevels/default/dbus"

          ln -sf /etc/init.d/seatd \
              "$TMP/etc/runlevels/default/seatd"

          ln -sf /etc/init.d/NetworkManager \
              "$TMP/etc/runlevels/default/NetworkManager"

          # ------------------------------------------------------------
          # APK repositories
          # ------------------------------------------------------------

          cat > "$TMP/etc/apk/repositories" <<'REPOS'
          https://dl-cdn.alpinelinux.org/alpine/edge/main
          https://dl-cdn.alpinelinux.org/alpine/edge/community
          REPOS

          # ------------------------------------------------------------
          # Hostname
          # ------------------------------------------------------------

          cat > "$TMP/etc/hostname" <<'HOST'
          alpine-sway
          HOST

          # ------------------------------------------------------------
          # Root password
          #
          # Empty password allows the live ISO root login.
          # The installed system should create its own user/password.
          # ------------------------------------------------------------

          cat > "$TMP/etc/motd" <<'MOTD'
          Alpine Sway OS

          Live environment

          Start Sway manually with:

              dbus-run-session sway

          Start the graphical installer with:

              python3 /usr/local/bin/phase1-installer.py

          MOTD

          # ------------------------------------------------------------
          # Build overlay
          # ------------------------------------------------------------

          cat > "$TMP/etc/apk/world" <<'WORLD'
          alpine-base
          busybox
          openrc
          sway
          swaybg
          swayidle
          swaylock
          waybar
          foot
          dbus
          dbus-openrc
          dbus-x11
          seatd
          seatd-openrc
          elogind
          elogind-openrc
          networkmanager
          networkmanager-cli
          networkmanager-openrc
          python3
          py3-gobject3
          gtk4.0
          util-linux
          e2fsprogs
          dosfstools
          parted
          bash
          curl
          wget
          git
          nano
          vim
          pciutils
          usbutils
          WORLD

          # ------------------------------------------------------------
          # Generate APK overlay
          # ------------------------------------------------------------

          cd "$TMP"

          tar -czf /tmp/sway-overlay.tar.gz .

          echo "Overlay created:"
          ls -lh /tmp/sway-overlay.tar.gz

      - name: Install overlay generator
        shell: sh
        run: |
          set -eux

          mkdir -p /tmp/aports/scripts

          cat > /tmp/aports/scripts/genapkovl-sway.sh <<'SH'
          #!/bin/sh

          set -eu

          workdir="${tmpdir:-/tmp/sway-overlay}"

          if [ ! -d "$workdir" ]; then
              echo "ERROR: overlay directory does not exist"
              exit 1
          fi

          cd "$workdir"

          find . -mindepth 1 -print

          tar -czf "$output" .

          echo "Generated overlay:"
          ls -lh "$output"
          SH

          chmod +x /tmp/aports/scripts/genapkovl-sway.sh

      - name: Verify package list
        shell: sh
        run: |
          set -eux

          cat > /tmp/test-world <<'WORLD'
          alpine-base
          busybox
          openrc
          sway
          swaybg
          swayidle
          swaylock
          waybar
          foot
          dbus
          dbus-openrc
          dbus-x11
          seatd
          seatd-openrc
          elogind
          elogind-openrc
          networkmanager
          networkmanager-cli
          networkmanager-openrc
          python3
          py3-gobject3
          gtk4.0
          util-linux
          e2fsprogs
          dosfstools
          parted
          bash
          curl
          wget
          git
          nano
          vim
          pciutils
          usbutils
          WORLD

          apk update

          apk add --no-cache $(tr '\n' ' ' < /tmp/test-world)

          echo
          echo "Python:"
          python3 --version

          echo
          echo "GTK:"
          apk info gtk4.0

          echo
          echo "GObject:"
          apk info py3-gobject3

      - name: Build Alpine ISO
        shell: sh
        run: |
          set -eux

          mkdir -p /workspace/out

          cd /tmp/aports

          export PACKAGER_PRIVKEY=/root/.abuild/alpineos.rsa
          export PACKAGER_PUBKEY=/root/.abuild/alpineos.rsa.pub

          ./scripts/mkimage.sh \
            --tag edge \
            --outdir /workspace/out \
            --arch x86_64 \
            --hostkeys \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/main \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/community \
            --profile sway

      - name: Verify generated ISO
        shell: sh
        run: |
          set -eux

          echo "Generated files:"
          find /workspace/out -maxdepth 2 -type f -ls

          ISO="$(find /workspace/out -type f -name '*.iso' | head -n 1)"

          if [ -z "$ISO" ]; then
              echo "ERROR: No ISO was generated."
              exit 1
          fi

          echo "ISO:"
          echo "$ISO"

          echo
          echo "ISO size:"
          du -h "$ISO"

          echo
          echo "ISO contents:"
          xorriso \
            -indev "$ISO" \
            -find / \
            -type f \
            -print

      - name: Verify Python is in generated image
        shell: sh
        run: |
          set -eux

          echo "Checking generated artifacts..."

          find /workspace/out \
            -type f \
            -maxdepth 2 \
            -print

          echo
          echo "The image package list explicitly contains:"
          echo "python3"
          echo "py3-gobject3"
          echo "gtk4.0"

      - name: Calculate SHA256
        shell: sh
        run: |
          set -eux

          cd /workspace/out

          sha256sum *.iso > SHA256SUMS

          cat SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-sway-iso
          path: |
            /workspace/out/*.iso
            /workspace/out/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpine-sway-${{ github.run_number }}
          name: Alpine Sway OS ${{ github.run_number }}
          files: |
            /workspace/out/*.iso
            /workspace/out/SHA256SUMS
          generate_release_notes: true
